  const [msgs, setMsgs] = useState<Message[]>([])
  const [reactions, setReactions] = useState<Reaction[]>([])
  const [atts, setAtts] = useState<Attachment[]>([])
  const [loading, setLoading] = useState(true)
  const [hasMore, setHasMore] = useState(false)
  const [text, setText] = useState('')
  const [sending, setSending] = useState(false)
  const [aiBusy, setAiBusy] = useState(false)
  const [error, setError] = useState<string | null>(null)
  const [replyTo, setReplyTo] = useState<Message | null>(null)
  const [editing, setEditing] = useState<Message | null>(null)
  const [menuFor, setMenuFor] = useState<string | null>(null)
  const [typing, setTyping] = useState<Record<string, number>>({})
  const [, setTick] = useState(0)
  const [panel, setPanel] = useState(false)
  const [members, setMembers] = useState<Member[]>([])
  const [kept, setKept] = useState<Kept[]>([])
  const [blocked, setBlocked] = useState(false)
  const [searchOpen, setSearchOpen] = useState(false)
  const [query, setQuery] = useState('')
  const [results, setResults] = useState<Message[] | null>(null)
  const [online, setOnline] = useState(typeof navigator === 'undefined' ? true : navigator.onLine)
  const [disappear, setDisappear] = useState<number | null>(null)
  const [muted, setMuted] = useState(convo.muted)
  const [gifOpen, setGifOpen] = useState(false)
  const [callOpen, setCallOpen] = useState(false)

  const msgsRef = useRef(msgs); msgsRef.current = msgs
  const bchRef = useRef<RealtimeChannel | null>(null)
  const listRef = useRef<HTMLDivElement>(null)
  const stickRef = useRef(true)
  const prependRef = useRef<number | null>(null)
  const lastTypingSent = useRef(0)
  const fileRef = useRef<HTMLInputElement>(null)
  const taRef = useRef<HTMLTextAreaElement>(null)

  const isGroup = convo.type === 'group'
  const myRole = members.find((m) => m.user_id === me)?.role
  const canManage = isGroup && (myRole === 'owner' || myRole === 'admin')
  const nameOf = useCallback((id: string) => usersRef.current[id]?.display_name ?? 'Someone', [])

  const fetchExtras = useCallback(async (ids: string[]) => {
    if (!ids.length) return
    const [r, a] = await Promise.all([
      supabase.from('message_reactions').select('message_id, user_id, emoji').in('message_id', ids),
      supabase.from('attachments').select('id, message_id, storage_path, file_name, mime_type, size_bytes').in('message_id', ids),
    ])
    const set = new Set(ids)
    setReactions((prev) => [...prev.filter((x) => !set.has(x.message_id)), ...((r.data as Reaction[] | null) ?? [])])
    setAtts((prev) => [...prev.filter((x) => !set.has(x.message_id)), ...((a.data as Attachment[] | null) ?? [])])
  }, [])

  const loadKept = useCallback(async () => {
    const { data } = await supabase.from('messages').select('id, content, sender_id, message_type')
      .eq('conversation_id', convo.id).eq('is_important', true).is('deleted_at', null).order('created_at', { ascending: false }).limit(50)
    setKept((data as Kept[] | null) ?? [])
  }, [convo.id])

  const loadMembers = useCallback(async () => {
    const { data } = await supabase.from('conversation_members').select('user_id, role, last_read_at').eq('conversation_id', convo.id)
    setMembers((data as Member[] | null) ?? [])
  }, [convo.id])

  const loadSettings = useCallback(async () => {
    const { data } = await supabase.from('conversations').select('disappear_after_hours').eq('id', convo.id).maybeSingle()
    setDisappear((data?.disappear_after_hours as number | null | undefined) ?? null)
  }, [convo.id])

  const markRead = useCallback(async () => {
    if (document.visibilityState !== 'visible') return
    const { data } = await supabase.rpc('mark_read', { p_cid: convo.id })
    const at = (data as string | null) ?? new Date().toISOString()
    setMembers((prev) => prev.map((m) => (m.user_id === me ? { ...m, last_read_at: at } : m)))
    void bchRef.current?.send({ type: 'broadcast', event: 'read', payload: { user_id: me, at } })
    onRead()
  }, [convo.id, me, onRead])

  const signalRefresh = useCallback(() => {
    void bchRef.current?.send({ type: 'broadcast', event: 'refresh', payload: {} })
  }, [])

  // initial load
  useEffect(() => {
    let live = true
    setMsgs([]); setReactions([]); setAtts([]); setLoading(true); setReplyTo(null); setEditing(null); setError(null)
    setMuted(convo.muted)
    stickRef.current = true
    void (async () => {
      const { data, error } = await supabase.from('messages').select('*').eq('conversation_id', convo.id)
        .order('created_at', { ascending: false }).limit(PAGE)
      if (!live) return
      if (error) { setError('Could not load messages. Check your connection.'); setLoading(false); return }
      const rows = ((data as Message[] | null) ?? []).reverse()
      setMsgs(rows); setHasMore((data?.length ?? 0) === PAGE)
      await fetchExtras(rows.map((m) => m.id))
      if (!live) return
      setLoading(false)
      void markRead(); void loadKept(); void loadMembers(); void loadSettings()
    })()
    return () => { live = false }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [convo.id, fetchExtras, markRead, loadKept, loadMembers, loadSettings])

  // realtime: row changes (RLS-checked) + private broadcast (typing, read and refresh signals)
  useEffect(() => {
    const catchUp = async () => {
      const latest = msgsRef.current[msgsRef.current.length - 1]?.created_at
      if (!latest) return
      const { data } = await supabase.from('messages').select('*').eq('conversation_id', convo.id).gt('created_at', latest).order('created_at')
      const rows = (data as Message[] | null) ?? []
      if (!rows.length) return
      setMsgs((prev) => { const seen = new Set(prev.map((m) => m.id)); return [...prev, ...rows.filter((m) => !seen.has(m.id))] })
      void fetchExtras(rows.map((m) => m.id)); void markRead()
    }
    const rows = supabase.channel(`rows:${convo.id}`)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `conversation_id=eq.${convo.id}` }, (p) => {
        const m = p.new as Message
        setMsgs((prev) => prev.some((x) => x.id === m.id) ? prev : [...prev, m])
        if (!usersRef.current[m.sender_id]) reloadDir()
        setTyping((t) => { const n = { ...t }; delete n[m.sender_id]; return n })
        if (m.message_type === 'system') void loadSettings()
        void fetchExtras([m.id])
        if (m.sender_id !== me) void markRead()
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages', filter: `conversation_id=eq.${convo.id}` }, (p) => {
        const m = p.new as Message
        setMsgs((prev) => prev.map((x) => x.id === m.id ? { ...x, ...m } : x))
        void loadKept()
      })
      .subscribe((status) => { if (status === 'SUBSCRIBED') void catchUp() })
    const bch = supabase.channel(`conversation:${convo.id}`, { config: { private: true } })
      .on('broadcast', { event: 'refresh' }, () => { void fetchExtras(msgsRef.current.slice(-100).map((m) => m.id)) })
      .on('broadcast', { event: 'read' }, ({ payload }) => {
        const p = payload as { user_id?: string; at?: string }
        const uid = p.user_id, at = p.at
        if (uid && at && uid !== me) setMembers((prev) => prev.map((m) => (m.user_id === uid ? { ...m, last_read_at: at } : m)))
      })
      .on('broadcast', { event: 'typing' }, ({ payload }) => {
        const id = (payload as { user_id?: string }).user_id
        if (id && id !== me) setTyping((p) => ({ ...p, [id]: Date.now() }))
      })
      .subscribe()
    bchRef.current = bch
    const tick = setInterval(() => setTick((t) => t + 1), 1500)
    const on = () => setOnline(true), off = () => setOnline(false)
    window.addEventListener('online', on); window.addEventListener('offline', off)
    return () => {
      clearInterval(tick); window.removeEventListener('online', on); window.removeEventListener('offline', off)
      bchRef.current = null
      void supabase.removeChannel(rows); void supabase.removeChannel(bch)
    }
  }, [convo.id, me, fetchExtras, markRead, loadKept, loadSettings, reloadDir])

  useEffect(() => {
    const onVisible = () => { if (document.visibilityState === 'visible') void markRead() }
    document.addEventListener('visibilitychange', onVisible)
    return () => document.removeEventListener('visibilitychange', onVisible)
  }, [markRead])

  useEffect(() => {
    if (!otherUserId) return
    supabase.from('blocks').select('blocked_id').eq('blocker_id', me).eq('blocked_id', otherUserId).maybeSingle().then(({ data }) => setBlocked(!!data))
  }, [otherUserId, me])

  useLayoutEffect(() => {
    const el = listRef.current
    if (!el) return
    if (prependRef.current !== null) { el.scrollTop += el.scrollHeight - prependRef.current; prependRef.current = null; return }
    if (stickRef.current) el.scrollTop = el.scrollHeight
  }, [msgs.length, loading, typing])

  async function loadOlder() {
    const first = msgs[0]
    if (!first) return
    const { data } = await supabase.from('messages').select('*').eq('conversation_id', convo.id)
      .lt('created_at', first.created_at).order('created_at', { ascending: false }).limit(PAGE)
    const older = ((data as Message[] | null) ?? []).reverse()
    prependRef.current = listRef.current?.scrollHeight ?? 0
    setMsgs((prev) => { const seen = new Set(prev.map((m) => m.id)); return [...older.filter((m) => !seen.has(m.id)), ...prev] })
    setHasMore((data?.length ?? 0) === PAGE)
    void fetchExtras(older.map((m) => m.id))
  }

  function onScroll() {
    const el = listRef.current
    if (el) stickRef.current = el.scrollHeight - el.scrollTop - el.clientHeight < 80
  }

  function confirmAi(): boolean {
    try { if (localStorage.getItem('commonroom-ai-notice') === '1') return true } catch { /* storage blocked */ }
    const ok = window.confirm('The assistant will send the last 30 messages of this chat to Groq, an external AI service, to write its answer. Continue?')
    if (ok) { try { localStorage.setItem('commonroom-ai-notice', '1') } catch { /* storage blocked */ } }
    return ok
  }

  async function askAssistant(prompt: string) {
    if (!prompt) return
    setAiBusy(true)
    try { await callAssistant({ mode: 'group', group_conversation_id: convo.id, message: prompt }, () => {}) }
    catch (e) { setError(e instanceof Error ? e.message : 'The assistant is unavailable.') }
    finally { setAiBusy(false) }
  }

  async function send() {
    const content = text.trim()
    if (!content || sending) return
    setError(null)
    if (editing) {
      setSending(true)
      const { error } = await supabase.from('messages').update({ content }).eq('id', editing.id)
      if (error) setError('Could not edit that message.')
      else setMsgs((prev) => prev.map((m) => m.id === editing.id ? { ...m, content, edited_at: new Date().toISOString() } : m))
      setEditing(null); setText(''); setSending(false)
      return
    }
    const wantsAi = /^@assistant\b/i.test(content)
    if (wantsAi && !confirmAi()) return
    setSending(true)
    const { data, error } = await supabase.from('messages')
      .insert({ conversation_id: convo.id, sender_id: me, content, reply_to_message_id: replyTo?.id ?? null }).select('*').single()
    setSending(false)
    if (error || !data) return setError('Message not sent. Check your connection and try again.')
    stickRef.current = true
    setMsgs((prev) => prev.some((x) => x.id === data.id) ? prev : [...prev, data as Message])
    setText(''); setReplyTo(null)
    if (wantsAi) void askAssistant(content.replace(/^@assistant\b[:,]?\s*/i, ''))
  }

  async function sendGif(url: string) {
    setGifOpen(false); setError(null)
    const { data, error } = await supabase.from('messages')
      .insert({ conversation_id: convo.id, sender_id: me, content: url, message_type: 'gif', reply_to_message_id: replyTo?.id ?? null }).select('*').single()
    if (error || !data) return setError('Could not send that GIF.')
    stickRef.current = true; setReplyTo(null)
    setMsgs((prev) => prev.some((x) => x.id === data.id) ? prev : [...prev, data as Message])
  }

  async function sendFile(picked: File | undefined) {
    if (!picked) return
    if (!ALLOWED_FILES.includes(picked.type)) return setError('Use a photo, video, PDF, or text file. For anything else, share a link.')
    setSending(true); setError(null)
    let file = picked
    if (picked.type.startsWith('image/')) {
      try { file = await compressImage(picked, 1600, 0.8) } catch { setSending(false); return setError('Could not read that image.') }
    }
    const isVideo = file.type.startsWith('video/')
    if (file.size > (isVideo ? MAX_VIDEO_BYTES : MAX_FILE_BYTES)) {
      setSending(false)
      return setError(isVideo ? 'Videos must be 15 MB or smaller. Trim it, or share a link.' : 'Files must be 3 MB or smaller. Share a link for bigger ones.')
    }
    const kind = file.type.startsWith('image/') ? 'image' : isVideo ? 'video' : 'file'
    const { data: msg, error: e1 } = await supabase.from('messages').insert({
      conversation_id: convo.id, sender_id: me, content: '', message_type: kind, reply_to_message_id: replyTo?.id ?? null,
    }).select('*').single()
    if (e1 || !msg) { setSending(false); return setError('Could not send the file.') }
    const path = `${convo.id}/${msg.id}-${file.name.replace(/[^\w.-]+/g, '_').slice(-80)}`
    const up = await supabase.storage.from('attachments').upload(path, file, { contentType: file.type, cacheControl: '3600' })
    const overQuota = !!up.error && /row-level security|policy|exceed/i.test(up.error.message)
    let ok = !up.error
    if (ok) {
      const { error: e3 } = await supabase.from('attachments').insert({
        message_id: msg.id, conversation_id: convo.id, uploader_id: me, storage_path: path,
        file_name: file.name.slice(0, 200), mime_type: file.type, size_bytes: file.size,
      })
      ok = !e3
    }
    stickRef.current = true
    if (!ok) {
      await supabase.from('messages').update({ deleted_at: new Date().toISOString() }).eq('id', msg.id)
      setMsgs((prev) => [...prev, { ...(msg as Message), content: '', deleted_at: new Date().toISOString() }])
      setError(overQuota ? 'You have used your 100 MB file allowance. Delete files in the Files library, or share a link.' : 'Upload failed. Try again.')
    } else {
      setMsgs((prev) => prev.some((x) => x.id === msg.id) ? prev : [...prev, msg as Message])
      await fetchExtras([msg.id]); signalRefresh(); setReplyTo(null)
    }
    setSending(false)
    if (fileRef.current) fileRef.current.value = ''
  }

  async function toggleReaction(m: Message, emoji: string) {
    setMenuFor(null)
    const mine = reactions.some((r) => r.message_id === m.id && r.user_id === me && r.emoji === emoji)
    if (mine) {
      await supabase.from('message_reactions').delete().eq('message_id', m.id).eq('user_id', me).eq('emoji', emoji)
      setReactions((prev) => prev.filter((r) => !(r.message_id === m.id && r.user_id === me && r.emoji === emoji)))
    } else {
      const { error } = await supabase.from('message_reactions').insert({ message_id: m.id, conversation_id: convo.id, user_id: me, emoji })
      if (!error) setReactions((prev) => [...prev, { message_id: m.id, user_id: me, emoji }])
    }
    signalRefresh()
  }

  async function deleteMsg(m: Message) {
    setMenuFor(null)
    if (!window.confirm('Delete this message for everyone?')) return
    const { error } = await supabase.from('messages').update({ deleted_at: new Date().toISOString() }).eq('id', m.id)
    if (error) setError('Could not delete that message.')
    else setMsgs((prev) => prev.map((x) => x.id === m.id ? { ...x, content: '', deleted_at: new Date().toISOString() } : x))
  }

  async function toggleImportant(m: Message) {
    setMenuFor(null)
    const next = !m.is_important
    const { error } = await supabase.rpc('set_message_important', { p_message: m.id, p_important: next })
    if (error) return setError('Could not change that message.')
    setMsgs((prev) => prev.map((x) => x.id === m.id ? { ...x, is_important: next, expires_at: next ? null : (disappear ? new Date(Date.now() + disappear * 3_600_000).toISOString() : null) } : x))
    void loadKept()
  }

  async function changeDisappearing(hours: number | null) {
    setError(null)
    const { error } = await supabase.rpc('set_disappearing', { p_cid: convo.id, p_hours: hours })
    if (error) setError(/admin/i.test(error.message) ? 'Only group admins can change this.' : 'Could not change that setting.')
    else setDisappear(hours)
  }

  async function toggleMute() {
    const next = !muted
    setMuted(next)
    const { error } = await supabase.from('conversation_members').update({ muted: next }).eq('conversation_id', convo.id).eq('user_id', me)
    if (error) setMuted(!next); else onRead()
  }

  async function startCall() {
    setError(null)
    const { error } = await supabase.rpc('post_call_message', { p_cid: convo.id })
    if (error) return setError('Could not start the call.')
    setCallOpen(true)
  }

  async function report(m: Message) {
    setMenuFor(null)
    const reason = window.prompt('What is wrong with this message? Admins will review it.')
    if (!reason?.trim()) return
    const { error } = await supabase.rpc('report_message', { p_message: m.id, p_reason: reason.trim() })
    setError(error ? 'Could not send your report.' : null)
    if (!error) window.alert('Thanks. An admin will take a look.')
  }

  async function toggleBlock() {
    if (!otherUserId) return
    if (blocked) await supabase.from('blocks').delete().eq('blocker_id', me).eq('blocked_id', otherUserId)
    else if (window.confirm('Block this person? Neither of you will be able to message the other.')) await supabase.from('blocks').insert({ blocker_id: me, blocked_id: otherUserId })
    const { data } = await supabase.from('blocks').select('blocked_id').eq('blocker_id', me).eq('blocked_id', otherUserId).maybeSingle()
    setBlocked(!!data)
  }

  async function addMember(id: string) {
    const { error } = await supabase.from('conversation_members').insert({ conversation_id: convo.id, user_id: id, role: 'member' })
    if (error) setError('Could not add that person.')
    await loadMembers()
  }
  async function removeMember(id: string) {
    if (!window.confirm(id === me ? 'Leave this group?' : 'Remove this person from the group?')) return
    const { error } = await supabase.from('conversation_members').delete().eq('conversation_id', convo.id).eq('user_id', id)
    if (error) setError('Could not remove that person.')
    if (id === me) onBack(); else await loadMembers()
  }

  async function runSearch() {
    const q = query.trim()
    if (!q) return setResults(null)
    const { data } = await supabase.from('messages').select('*').eq('conversation_id', convo.id).is('deleted_at', null)
      .textSearch('fts', q, { type: 'websearch', config: 'simple' }).order('created_at', { ascending: false }).limit(30)
    setResults((data as Message[] | null) ?? [])
  }

  function onKey(e: KeyboardEvent<HTMLTextAreaElement>) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); void send() }
    if (e.key === 'Escape') { setReplyTo(null); setEditing(null); setText('') }
  }
  function onType(v: string) {
    setText(v)
    if (Date.now() - lastTypingSent.current > 2500) {
      lastTypingSent.current = Date.now()
      void bchRef.current?.send({ type: 'broadcast', event: 'typing', payload: { user_id: me } })
    }
  }

  const byId = useMemo(() => new Map(msgs.map((m) => [m.id, m])), [msgs])
  const nowMs = Date.now()
  const visible = msgs.filter((m) => !m.expires_at || Date.parse(m.expires_at) > nowMs)
  const typingNames = Object.entries(typing).filter(([id, t]) => id !== me && nowMs - t < 4000).map(([id]) => nameOf(id))
  const nonMembers = list.filter((u) => !members.some((m) => m.user_id === u.id))
  const others = members.filter((m) => m.user_id !== me)
  const seenBy = (m: Message) => others.filter((o) => o.last_read_at && Date.parse(o.last_read_at) >= Date.parse(m.created_at))
  const lastMineId = [...visible].reverse().find((m) => m.sender_id === me && !m.deleted_at && ['text', 'image', 'video', 'file', 'gif'].includes(m.message_type))?.id
  const seenLabel = (m: Message) => {
    const s = seenBy(m)
    if (!s.length) return 'Sent'
    if (!isGroup) return 'Seen'
    if (s.length === others.length) return 'Seen by everyone'
    return s.length <= 2 ? `Seen by ${s.map((x) => nameOf(x.user_id)).join(', ')}` : `Seen by ${s.length}`
  }
  const disappearLabel = disappear === 24 ? '24 hours' : disappear === 168 ? '7 days' : null

  useEffect(() => {
    const el = taRef.current
    if (!el) return
    el.style.height = 'auto'
    el.style.height = Math.min(el.scrollHeight, 128) + 'px'
  }, [text])

  return (
    <div className="relative flex h-full min-w-0">
      <section className="flex min-w-0 flex-1 flex-col">
        <header className="glass flex items-center gap-2 border-b border-white/5 px-3 pb-2.5 pt-[max(0.625rem,env(safe-area-inset-top))] md:pt-2.5">
          <button onClick={onBack} aria-label="Back to chats" className="rounded-xl p-2 text-fg transition hover:bg-white/5 md:hidden"><ArrowLeft size={20} /></button>
          <Avatar path={avatarPath} name={title} size={40} />
          <div className="min-w-0 flex-1">
            <h2 className="flex items-center gap-1.5 truncate text-[15px] font-semibold leading-tight">{title}{muted && <BellOff size={13} className="shrink-0 text-mute" aria-label="Muted" />}</h2>
            <p className={`truncate text-xs ${typingNames.length ? 'text-accent' : 'text-mute'}`} aria-live="polite">
              {typingNames.length ? (isGroup ? `${typingNames.join(', ')} typing…` : 'typing…') : `${isGroup ? `${members.length || ''} members` : 'Private chat'}${disappearLabel ? ` · disappears after ${disappearLabel}` : ''}`}
            </p>
          </div>
          <button onClick={() => void startCall()} aria-label="Start a video call" className="rounded-xl p-2.5 text-mute transition hover:bg-white/5 hover:text-fg"><Video size={18} /></button>
          <button onClick={() => setSearchOpen((v) => !v)} aria-label="Search messages" className="rounded-xl p-2.5 text-mute transition hover:bg-white/5 hover:text-fg"><Search size={18} /></button>
          <button onClick={() => setPanel((v) => !v)} aria-label="Chat details" aria-pressed={panel} className={`rounded-xl p-2.5 transition hover:bg-white/5 ${panel ? 'text-accent' : 'text-mute hover:text-fg'}`}><Users size={18} /></button>
        </header>

        {searchOpen && (
          <div className="animate-pop border-b border-white/5 p-3">
            <form onSubmit={(e) => { e.preventDefault(); void runSearch() }} className="flex gap-2">
              <input className="field" autoFocus placeholder="Search this chat" aria-label="Search this chat" value={query} onChange={(e) => setQuery(e.target.value)} />
              <button className="btn-quiet">Search</button>
            </form>
            {results && (
              <ul className="mt-2 max-h-48 divide-y divide-white/5 overflow-y-auto rounded-xl border border-white/10 text-sm">
                {results.length === 0 && <li className="p-3 text-mute">No matches.</li>}
                {results.map((r) => <li key={r.id} className="p-2.5"><span className="text-xs text-mute">{nameOf(r.sender_id)} · {new Date(r.created_at).toLocaleString()}</span><p className="break-words">{r.content}</p></li>)}
              </ul>
            )}
          </div>
        )}
        {kept.length > 0 && (
          <button onClick={() => setPanel(true)} className="flex items-center gap-2 border-b border-white/5 bg-warn/10 px-4 py-1.5 text-left text-xs">
            <Star size={14} className="shrink-0 fill-current text-warn" /><span className="truncate"><strong>{nameOf(kept[0].sender_id)}:</strong> {kept[0].content || `[${kept[0].message_type}]`}</span>
            {kept.length > 1 && <span className="shrink-0 text-mute">+{kept.length - 1}</span>}
          </button>
        )}
        {!online && <p role="status" className="bg-warn/15 px-3 py-1.5 text-center text-xs text-warn">You are offline. Messages will not send until you reconnect.</p>}

        <div ref={listRef} onScroll={onScroll} className="min-h-0 flex-1 overflow-y-auto px-3 py-4 sm:px-6">
          <div className="mx-auto w-full max-w-3xl">
            {hasMore && <button onClick={loadOlder} className="mx-auto mb-4 block rounded-full border border-white/10 bg-white/5 px-4 py-1.5 text-xs text-mute transition hover:text-fg">Load earlier messages</button>}
            {loading && <div className="space-y-3">{[0, 1, 2].map((i) => <div key={i} className={`h-12 w-2/3 animate-pulse rounded-2xl bg-white/5 ${i % 2 ? 'ml-auto' : ''}`} />)}</div>}
            {!loading && visible.length === 0 && <p className="mx-auto mt-16 max-w-xs text-center text-sm text-mute">No messages yet. Say hello, send a GIF, or type <span className="text-accent">@assistant</span> and a question to ask the AI.</p>}
            {visible.map((m, i) => {
              const mine = m.sender_id === me
              const prev = visible[i - 1]
              const newDay = !prev || new Date(prev.created_at).toDateString() !== new Date(m.created_at).toDateString()
              const sep = newDay && <p className="mb-3 mt-5 text-center"><span className="rounded-full bg-white/5 px-3 py-1 text-xs text-mute">{new Date(m.created_at).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' })}</span></p>

              if (m.message_type === 'system') {
                const isCall = m.content === 'started a video call'
                const recent = Date.now() - Date.parse(m.created_at) < 3_600_000
                return (
                  <div key={m.id} className="animate-pop">
                    {sep}
                    <p className="my-3 flex items-center justify-center gap-2 text-center text-xs text-mute">
                      <span className="inline-flex items-center gap-2 rounded-full bg-white/5 px-3 py-1.5">
                        {isCall && <Video size={13} className="text-accent" />}{mine ? 'You' : nameOf(m.sender_id)} {m.content}
                        {isCall && recent && <button onClick={() => setCallOpen(true)} className="rounded-full bg-accent px-2.5 py-0.5 font-semibold text-ink">Join</button>}
                      </span>
                    </p>
                  </div>
                )
              }

              const isAi = m.message_type === 'assistant'
              const sameRun = !!prev && !newDay && prev.sender_id === m.sender_id && prev.message_type !== 'assistant' && prev.message_type !== 'system' && !isAi
              const showName = !mine && isGroup && !sameRun
              const rs = reactions.filter((r) => r.message_id === m.id)
              const grouped = rs.map((r) => r.emoji).filter((e, idx, a) => a.indexOf(e) === idx)
              const target = m.reply_to_message_id ? byId.get(m.reply_to_message_id) : undefined
              const deleted = !!m.deleted_at
              const seen = mine && !isAi && seenBy(m).length > 0
              const bubble = isAi ? 'border border-accent/30 bg-accent/10' : mine ? 'bubble-me rounded-br-md' : 'bubble-them rounded-bl-md'
              return (
                <div key={m.id} className={`animate-pop ${sameRun ? 'mt-0.5' : 'mt-3'}`}>
                  {sep}
                  <div className={`group relative flex ${mine ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[85%] rounded-2xl px-3.5 py-2 sm:max-w-[70%] ${bubble} ${deleted ? 'opacity-60' : ''}`}>
                      {showName && <p className="mb-0.5 text-xs font-semibold text-accent">{nameOf(m.sender_id)}</p>}
                      {isAi && <p className="mb-1 flex items-center gap-1 text-xs font-semibold text-accent"><Sparkles size={12} />Assistant · asked by {mine ? 'you' : nameOf(m.sender_id)}</p>}
                      {target && !deleted && <p className={`mb-1.5 truncate rounded-md border-l-2 bg-black/10 px-2 py-1 text-xs ${mine && !isAi ? 'border-white/60 text-white/85' : 'border-accent text-mute'}`}>{nameOf(target.sender_id)}: {target.deleted_at ? 'Deleted message' : target.content || `[${target.message_type}]`}</p>}
                      {deleted ? <p className="text-sm italic">This message was deleted</p>
                        : isAi ? <Markdown text={m.content} />
                        : m.message_type === 'gif' ? <img src={m.content} alt="GIF" loading="lazy" referrerPolicy="no-referrer" className="max-h-60 max-w-full rounded-xl" />
                        : m.content && <p className="whitespace-pre-wrap break-words text-[15px] leading-snug">{m.content}</p>}
                      {!deleted && atts.filter((a) => a.message_id === m.id).map((a) => <AttachmentView key={a.id} att={a} />)}
                      <p className={`mt-1 flex items-center justify-end gap-1.5 text-[11px] ${mine && !isAi ? 'text-white/70' : 'text-mute'}`}>
                        {m.is_important && !deleted && <Star size={12} className="fill-current text-warn" aria-label="Important" />}
                        {m.expires_at && !deleted && <span className="inline-flex items-center gap-0.5" title="Disappears"><Timer size={11} />{timeLeft(m.expires_at)}</span>}
                        <span>{new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}{m.edited_at && !deleted ? ' · edited' : ''}</span>
                        {mine && !isAi && !deleted && (seen ? <CheckCheck size={14} className="text-[#c8f7e3]" aria-label="Seen" /> : <Check size={14} aria-label="Sent" />)}
                      </p>
                    </div>
                    {!deleted && <button onClick={() => setMenuFor(menuFor === m.id ? null : m.id)} aria-label="Message actions" className={`absolute top-0 rounded-full p-1.5 text-mute opacity-60 transition hover:bg-white/10 hover:opacity-100 focus:opacity-100 sm:opacity-0 sm:group-hover:opacity-100 ${mine ? 'left-0 sm:left-4' : 'right-0 sm:right-4'}`}><MoreHorizontal size={16} /></button>}
                    {menuFor === m.id && (
                      <>
                        <button aria-label="Close menu" className="fixed inset-0 z-10 cursor-default" onClick={() => setMenuFor(null)} />
                        <div className={`glass absolute top-7 z-20 w-60 animate-pop rounded-2xl border border-white/10 bg-surface p-2 shadow-2xl ${mine ? 'right-8' : 'left-8'}`}>
                          <div className="mb-1 flex justify-between px-1">{EMOJIS.map((e) => <button key={e} onClick={() => toggleReaction(m, e)} className="rounded-lg p-1 text-lg transition hover:scale-110 hover:bg-white/10" aria-label={`React ${e}`}>{e}</button>)}</div>
                          <button className="flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-sm hover:bg-white/5" onClick={() => { setReplyTo(m); setMenuFor(null) }}><Reply size={14} />Reply</button>
                          <button className="flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-sm hover:bg-white/5" onClick={() => toggleImportant(m)}><Star size={14} />{m.is_important ? 'Remove important mark' : 'Mark important (never disappears)'}</button>
                          {mine && m.message_type === 'text' && <button className="flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-sm hover:bg-white/5" onClick={() => { setEditing(m); setText(m.content); setMenuFor(null) }}><Pencil size={14} />Edit</button>}
                          {mine && <button className="flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-sm text-bad hover:bg-white/5" onClick={() => deleteMsg(m)}><Trash2 size={14} />Delete</button>}
                          {!mine && <button className="flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-sm hover:bg-white/5" onClick={() => report(m)}><Flag size={14} />Report</button>}
                        </div>
                      </>
                    )}
                  </div>
                  {grouped.length > 0 && (
                    <div className={`mt-1 flex flex-wrap gap-1 ${mine ? 'justify-end' : 'justify-start'}`}>
                      {grouped.map((e) => {
                        const n = rs.filter((r) => r.emoji === e).length
                        const iReacted = rs.some((r) => r.emoji === e && r.user_id === me)
                        return <button key={e} onClick={() => toggleReaction(m, e)} aria-pressed={iReacted} className={`rounded-full border px-2 py-0.5 text-xs transition ${iReacted ? 'border-accent/60 bg-accent/20' : 'border-white/10 bg-white/5'}`}>{e} {n}</button>
                      })}
                    </div>
                  )}
                  {m.id === lastMineId && <p className="mt-0.5 text-right text-[11px] text-mute" aria-live="polite">{seenLabel(m)}</p>}
                </div>
              )
            })}
            {typingNames.length > 0 && (
              <div className="mt-3 flex animate-pop justify-start" role="status" aria-label={`${typingNames.join(', ')} typing`}>
                <div className="bubble-them flex items-center gap-2 rounded-2xl rounded-bl-md px-3.5 py-3">
                  <span className="flex gap-1">{[0, 1, 2].map((i) => <span key={i} className="h-1.5 w-1.5 animate-dot rounded-full bg-mute" style={{ animationDelay: `${i * 0.18}s` }} />)}</span>
                  {isGroup && <span className="text-xs text-mute">{typingNames.join(', ')}</span>}
                </div>
              </div>
            )}
            {aiBusy && <p role="status" className="mt-3 flex items-center gap-2 text-xs text-accent"><Sparkles size={14} />The assistant is writing a reply…</p>}
          </div>
        </div>

        <footer className="px-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] pt-2 sm:px-6">
          <div className="relative mx-auto w-full max-w-3xl">
            {gifOpen && <GifPicker onPick={(u) => void sendGif(u)} onClose={() => setGifOpen(false)} />}
            {(replyTo || editing) && (
              <div className="mb-2 flex animate-pop items-center gap-2 rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-xs">
                <span className="min-w-0 flex-1 truncate text-mute">{editing ? 'Editing message' : `Replying to ${nameOf(replyTo!.sender_id)}: ${replyTo!.content || `[${replyTo!.message_type}]`}`}</span>
                <button aria-label="Cancel" onClick={() => { setReplyTo(null); setEditing(null); setText('') }}><X size={14} /></button>
              </div>
            )}
            {error && <p role="alert" className="mb-2 text-sm text-bad">{error}</p>}
            <div className="glass flex items-end gap-0.5 rounded-2xl border border-white/10 p-1.5 shadow-xl shadow-black/30">
              <input ref={fileRef} type="file" hidden accept={ALLOWED_FILES.join(',')} onChange={(e) => void sendFile(e.target.files?.[0])} />
              <button onClick={() => fileRef.current?.click()} disabled={sending || !!editing} aria-label="Attach a photo, video or file" className="rounded-xl p-2.5 text-mute transition hover:bg-white/10 hover:text-fg disabled:opacity-40"><Paperclip size={20} /></button>
              <button onClick={() => setGifOpen((v) => !v)} disabled={!!editing} aria-label="Send a GIF" aria-pressed={gifOpen} className="rounded-xl px-2 py-2.5 text-xs font-bold text-mute transition hover:bg-white/10 hover:text-fg disabled:opacity-40">GIF</button>
              <button onClick={() => setText((t) => /^@assistant\b/i.test(t) ? t : `@assistant ${t}`)} disabled={!!editing} aria-label="Ask the AI assistant" title="Ask the AI assistant" className="rounded-xl p-2.5 text-accent transition hover:bg-white/10 disabled:opacity-40"><Sparkles size={20} /></button>
              <textarea ref={taRef} value={text} onChange={(e) => onType(e.target.value)} onKeyDown={onKey} rows={1} maxLength={4000} aria-label="Message"
                placeholder="Write a message" className="max-h-32 min-h-[40px] flex-1 resize-none bg-transparent px-2 py-2.5 text-[15px] text-fg placeholder:text-mute/70 focus:outline-none" />
              <button onClick={() => void send()} disabled={sending || !text.trim()} aria-label={editing ? 'Save edit' : 'Send message'} className="btn-primary h-10 w-10 shrink-0 !rounded-xl !px-0"><Send size={18} /></button>
            </div>
          </div>
        </footer>
      </section>

      {panel && (
        <aside className="glass absolute inset-y-0 right-0 z-30 w-full max-w-xs animate-pop overflow-y-auto border-l border-white/10 bg-surface p-4 md:static md:z-auto md:animate-none" aria-label="Chat details">
          <div className="flex items-center justify-between"><h3 className="font-display text-lg font-bold">Details</h3><button onClick={() => setPanel(false)} aria-label="Close details" className="rounded-xl p-2 hover:bg-white/5"><X size={18} /></button></div>

          <h4 className="mt-4 text-xs font-semibold uppercase tracking-wide text-mute">Disappearing messages</h4>
          <select className="field mt-2" aria-label="Disappearing messages" value={disappear ?? ''} disabled={isGroup && !canManage}
            onChange={(e) => void changeDisappearing(e.target.value ? Number(e.target.value) : null)}>
            <option value="">Off</option><option value="24">After 24 hours</option><option value="168">After 7 days</option>
          </select>
          <p className="mt-1 text-xs text-mute">{isGroup && !canManage ? 'Only group admins can change this. ' : ''}Applies to new messages. Starred important messages are kept.</p>

          <button onClick={toggleMute} aria-pressed={muted} className="btn-quiet mt-4 w-full"><BellOff size={16} />{muted ? 'Unmute this chat' : 'Mute this chat'}</button>

          <h4 className="mt-6 text-xs font-semibold uppercase tracking-wide text-mute">{isGroup ? 'Members' : 'Person'}</h4>
          <ul className="mt-2 space-y-1">
            {members.map((m) => (
              <li key={m.user_id} className="flex items-center gap-2 rounded-xl p-1.5 text-sm">
                <Avatar path={users[m.user_id]?.avatar_path} name={nameOf(m.user_id)} size={32} />
                <span className="min-w-0 flex-1 truncate">{nameOf(m.user_id)}{m.user_id === me ? ' (you)' : ''}</span>
                <span className="text-xs text-mute">{m.role === 'member' ? '' : m.role}</span>
                {isGroup && m.role !== 'owner' && (canManage || m.user_id === me) && <button className="text-xs text-bad" onClick={() => removeMember(m.user_id)}>{m.user_id === me ? 'Leave' : 'Remove'}</button>}
              </li>
            ))}
          </ul>
          {canManage && nonMembers.length > 0 && (
            <label className="mt-3 block text-sm"><span className="mb-1 block text-mute">Add a member</span>
              <select className="field" value="" onChange={(e) => e.target.value && void addMember(e.target.value)}>
                <option value="">Choose…</option>{nonMembers.map((u) => <option key={u.id} value={u.id}>{u.display_name}</option>)}
              </select></label>
          )}
          {!isGroup && otherUserId && <button className="btn-quiet mt-4 w-full" onClick={toggleBlock}><Ban size={16} />{blocked ? 'Unblock' : 'Block'} {nameOf(otherUserId)}</button>}

          <h4 className="mt-6 text-xs font-semibold uppercase tracking-wide text-mute">Important messages</h4>
          {kept.length === 0 ? <p className="mt-1 text-sm text-mute">Mark a message important and it will never disappear.</p> : <ul className="mt-2 space-y-2 text-sm">{kept.map((p) => <li key={p.id} className="rounded-xl bg-white/5 p-2.5"><span className="text-xs text-mute">{nameOf(p.sender_id)}</span><p className="break-words">{p.content || `[${p.message_type}]`}</p></li>)}</ul>}
          <h4 className="mt-6 text-xs font-semibold uppercase tracking-wide text-mute">Shared files</h4>
          {atts.length === 0 ? <p className="mt-1 text-sm text-mute">No files yet.</p> : <div className="mt-2 space-y-1">{atts.map((a) => <AttachmentView key={a.id} att={a} />)}</div>}
        </aside>
      )}
      {callOpen && <CallOverlay conversationId={convo.id} title={title} onClose={() => setCallOpen(false)} />}
    </div>
  )
}

// ---- src/features/assistant/AssistantView.tsx ----

interface Conv { id: string; title: string; updated_at: string }
interface Msg { id: string; role: 'user' | 'assistant'; content: string }

function AssistantView() {
  const [convs, setConvs] = useState<Conv[]>([])
  const [activeId, setActiveId] = useState<string | null>(null)
  const [msgs, setMsgs] = useState<Msg[]>([])
  const [input, setInput] = useState('')
  const [streaming, setStreaming] = useState('')
  const [busy, setBusy] = useState(false)
  const [error, setError] = useState<string | null>(null)
  const skipLoad = useRef(false)
  const endRef = useRef<HTMLDivElement>(null)

  const loadConvs = useCallback(async () => {
    const { data } = await supabase.from('assistant_conversations').select('id, title, updated_at').order('updated_at', { ascending: false }).limit(50)
    setConvs((data as Conv[] | null) ?? [])
  }, [])

  useEffect(() => { void loadConvs() }, [loadConvs])

  useEffect(() => {
    if (skipLoad.current) { skipLoad.current = false; return }
    if (!activeId) { setMsgs([]); return }
    let live = true
    supabase.from('assistant_messages').select('id, role, content').eq('conversation_id', activeId).order('created_at')
      .then(({ data }) => { if (live) setMsgs((data as Msg[] | null) ?? []) })
    return () => { live = false }
  }, [activeId])

  useEffect(() => { endRef.current?.scrollIntoView({ block: 'end' }) }, [msgs.length, streaming])

  async function send() {
    const message = input.trim()
    if (!message || busy) return
    setError(null); setBusy(true); setInput(''); setStreaming('')
    setMsgs((m) => [...m, { id: `local-${Date.now()}`, role: 'user', content: message }])
    let acc = ''
    try {
      await callAssistant(
        { mode: 'private', message, assistant_conversation_id: activeId ?? undefined },
        (e) => {
          if (e.conversation_id && !activeId) { skipLoad.current = true; setActiveId(e.conversation_id) }
          if (e.delta) { acc += e.delta; setStreaming(acc) }
          if (e.error) setError(e.error)
        },
      )
      if (acc) setMsgs((m) => [...m, { id: `local-a-${Date.now()}`, role: 'assistant', content: acc }])
    } catch (err) {
      setError(err instanceof Error ? err.message : 'The assistant is unavailable.')
    } finally {
      setStreaming(''); setBusy(false); void loadConvs()
    }
  }

  async function remove(id: string) {
    if (!window.confirm('Delete this assistant conversation?')) return
    await supabase.from('assistant_conversations').delete().eq('id', id)
    if (id === activeId) { setActiveId(null); setMsgs([]) }
    await loadConvs()
  }

  return (
    <div className="flex h-full min-w-0 flex-col">
      <header className="glass flex items-center gap-2 border-b border-white/5 p-3">
        <Sparkles size={18} className="text-accent" />
        <h2 className="font-display text-lg font-bold">AI Assistant</h2>
        <select aria-label="Conversation" className="field ml-auto max-w-[45%] py-1.5" value={activeId ?? ''} onChange={(e) => setActiveId(e.target.value || null)}>
          <option value="">New conversation</option>
          {convs.map((c) => <option key={c.id} value={c.id}>{c.title}</option>)}
        </select>
        <button className="btn-quiet !px-3" onClick={() => { setActiveId(null); setMsgs([]); setError(null) }} aria-label="Start a new conversation"><Plus size={16} /></button>
        {activeId && <button className="btn-quiet !px-3" onClick={() => remove(activeId)} aria-label="Delete this conversation"><Trash2 size={16} /></button>}
      </header>

      <div className="min-h-0 flex-1 overflow-y-auto p-4">
        <div className="mx-auto max-w-2xl space-y-4">
          {msgs.length === 0 && !streaming && (
            <div className="mt-10 text-center text-sm text-mute">
              <p className="font-display text-lg font-bold text-fg">What are we building?</p>
              <p className="mt-1">Ask for help with code, a database design, a bug, or a plan. Your messages go to Groq to generate the answer.</p>
            </div>
          )}
          {msgs.map((m) => (
            <div key={m.id} className={m.role === 'user' ? 'bubble-me ml-auto max-w-[85%] rounded-2xl rounded-br-md px-3.5 py-2 text-sm' : 'max-w-full'}>
              {m.role === 'user' ? <p className="whitespace-pre-wrap break-words">{m.content}</p> : <Markdown text={m.content} />}
            </div>
          ))}
          {streaming && <Markdown text={streaming} />}
          {busy && !streaming && <div className="h-4 w-24 animate-pulse rounded bg-raised" role="status" aria-label="Assistant is thinking" />}
          <div ref={endRef} />
        </div>
      </div>

      <footer className="p-3 pb-[max(0.75rem,env(safe-area-inset-bottom))]">
        {error && <p role="alert" className="mx-auto mb-2 max-w-2xl text-sm text-bad">{error}</p>}
        <div className="mx-auto flex max-w-2xl items-end gap-2">
          <textarea rows={1} maxLength={8000} aria-label="Message the assistant" placeholder="Ask anything" value={input} onChange={(e) => setInput(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); void send() } }}
            className="field max-h-40 min-h-[44px] flex-1 resize-none" />
          <button className="btn-primary h-11 w-11 !px-0" onClick={() => void send()} disabled={busy || !input.trim()} aria-label="Send"><Send size={18} /></button>
        </div>
      </footer>
    </div>
  )
}

// ---- src/features/library/LibraryView.tsx ----

interface FileRow {
  id: string; conversation_id: string; uploader_id: string; storage_path: string
  file_name: string; mime_type: string; size_bytes: number; created_at: string
}
type Filter = 'all' | 'images' | 'videos' | 'docs'

function Thumb({ row }: { row: FileRow }) {
  const [url, setUrl] = useState<string | null>(null)
  const isImg = row.mime_type.startsWith('image/')
  useEffect(() => {
    if (!isImg) return
    let live = true
    signedUrl(row.storage_path).then((u) => { if (live) setUrl(u) })
    return () => { live = false }
  }, [row.storage_path, isImg])
  if (isImg) return url ? <img src={url} alt={row.file_name} loading="lazy" className="h-full w-full object-cover" /> : <div className="h-full w-full animate-pulse bg-white/5" />
  const Icon = row.mime_type.startsWith('video/') ? Film : FileText
  return <div className="flex h-full w-full items-center justify-center bg-white/5"><Icon size={30} className="text-accent" /></div>
}

function LibraryView({ titleOf }: { titleOf: (conversationId: string) => string }) {
  const { session } = useAuth()
  const me = session!.user.id
  const { users } = useDirectory()
  const [rows, setRows] = useState<FileRow[] | null>(null)
  const [filter, setFilter] = useState<Filter>('all')
  const [q, setQ] = useState('')
  const [error, setError] = useState<string | null>(null)

  const load = useCallback(async () => {
    const { data, error } = await supabase.from('attachments')
      .select('id, conversation_id, uploader_id, storage_path, file_name, mime_type, size_bytes, created_at')
      .order('created_at', { ascending: false }).limit(300)
    if (error) setError('Could not load files.'); else setRows((data as FileRow[] | null) ?? [])
  }, [])
  useEffect(() => { void load() }, [load])

  const mine = (rows ?? []).filter((r) => r.uploader_id === me).reduce((n, r) => n + r.size_bytes, 0)
  const shown = useMemo(() => (rows ?? []).filter((r) =>
    (filter === 'all' || (filter === 'images' && r.mime_type.startsWith('image/')) || (filter === 'videos' && r.mime_type.startsWith('video/'))
      || (filter === 'docs' && !r.mime_type.startsWith('image/') && !r.mime_type.startsWith('video/')))
    && r.file_name.toLowerCase().includes(q.toLowerCase())), [rows, filter, q])

  async function remove(r: FileRow) {
    if (!window.confirm(`Delete "${r.file_name}"? It will disappear from the chat too.`)) return
    const rm = await supabase.storage.from('attachments').remove([r.storage_path])
    if (rm.error) return setError('Could not delete that file.')
    await supabase.from('attachments').delete().eq('id', r.id)
    await load()
  }

  return (
    <section className="mx-auto h-full w-full max-w-4xl overflow-y-auto p-4 sm:p-8">
      <h2 className="font-display text-2xl font-bold">File library</h2>
      <p className="mt-1 text-sm text-mute">Everything shared in your chats, in one place. Files in disappearing chats are removed with their messages.</p>

      <div className="panel mt-5 p-4">
        <div className="flex items-center justify-between text-sm"><span>Your uploads</span><span className="text-mute">{fmtSize(mine)} of {fmtSize(QUOTA_BYTES)}</span></div>
        <div className="mt-2 h-2 overflow-hidden rounded-full bg-white/10"><div className="h-full rounded-full bg-gradient-to-r from-accent to-indigo-400" style={{ width: `${Math.min(100, (mine / QUOTA_BYTES) * 100)}%` }} /></div>
        <p className="mt-2 text-xs text-mute">Delete files you no longer need to free space.</p>
      </div>

      <div className="mt-5 flex flex-wrap items-center gap-2">
        {([['all', 'All'], ['images', 'Photos'], ['videos', 'Videos'], ['docs', 'Documents']] as [Filter, string][]).map(([id, label]) => (
          <button key={id} onClick={() => setFilter(id)} aria-pressed={filter === id} className={`rounded-full px-3.5 py-1.5 text-sm transition ${filter === id ? 'bg-accent font-semibold text-ink' : 'bg-white/5 text-mute hover:text-fg'}`}>{label}</button>
        ))}
        <input className="field ml-auto max-w-[12rem] !py-1.5" placeholder="Search files" aria-label="Search files" value={q} onChange={(e) => setQ(e.target.value)} />
      </div>

      {error && <p role="alert" className="mt-3 text-sm text-bad">{error}</p>}
      {rows === null && <div className="mt-5 grid grid-cols-2 gap-3 sm:grid-cols-3">{[0, 1, 2].map((i) => <div key={i} className="h-44 animate-pulse rounded-2xl bg-white/5" />)}</div>}
      {rows && shown.length === 0 && <p className="mt-10 text-center text-sm text-mute"><ImageIcon className="mx-auto mb-2" size={28} />No files here yet. Share a photo, video or document in a chat and it shows up.</p>}

      <ul className="mt-5 grid grid-cols-2 gap-3 pb-6 sm:grid-cols-3">
        {shown.map((r) => (
          <li key={r.id} className="panel overflow-hidden !rounded-2xl">
            <div className="h-28 sm:h-36"><Thumb row={r} /></div>
            <div className="p-3">
              <p className="truncate text-sm font-medium" title={r.file_name}>{r.file_name}</p>
              <p className="truncate text-xs text-mute">{users[r.uploader_id]?.display_name ?? 'Someone'} · {titleOf(r.conversation_id)}</p>
              <p className="text-xs text-mute">{fmtSize(r.size_bytes)} · {new Date(r.created_at).toLocaleDateString()}</p>
              <div className="mt-2 flex gap-1">
                <button onClick={() => openDownload(r.storage_path, r.file_name)} className="btn-quiet !px-2.5 !py-1.5 text-xs" aria-label={`Download ${r.file_name}`}><Download size={14} />Open</button>
                {r.uploader_id === me && <button onClick={() => remove(r)} className="btn-quiet !px-2.5 !py-1.5 text-xs text-bad" aria-label={`Delete ${r.file_name}`}><Trash2 size={14} /></button>}
              </div>
            </div>
          </li>
        ))}
      </ul>
    </section>
  )
}

// ---- src/features/projects/ProjectsView.tsx ----

interface Project { id: string; name: string; description: string | null; status: 'active' | 'archived'; conversation_id: string | null; created_by: string | null; created_at: string }
interface Task { id: string; project_id: string; title: string; status: 'todo' | 'doing' | 'done'; assignee_id: string | null; due_date: string | null }
interface Idea { id: string; content: string; created_by: string | null; created_at: string }
interface Vote { idea_id: string; user_id: string }
interface LinkRow { id: string; title: string; url: string; created_by: string | null }
interface PMember { user_id: string; role: 'owner' | 'member' }

const COLS: { id: Task['status']; label: string }[] = [{ id: 'todo', label: 'To do' }, { id: 'doing', label: 'In progress' }, { id: 'done', label: 'Done' }]

function NewProjectDialog({ onClose, onCreated }: { onClose: () => void; onCreated: (id: string) => void }) {
  const { session } = useAuth()
  const { list } = useDirectory()
  const [name, setName] = useState('')
  const [desc, setDesc] = useState('')
  const [picked, setPicked] = useState<string[]>([])
  const [busy, setBusy] = useState(false)
  const [error, setError] = useState<string | null>(null)
  const people = list.filter((u) => u.id !== session?.user.id)

  async function create() {
    if (!name.trim()) return setError('Give the project a name.')
    setBusy(true); setError(null)
    const { data, error } = await supabase.rpc('create_project', { p_name: name.trim(), p_description: desc.trim() || null, p_members: picked })
    setBusy(false)
    if (error || !data) return setError('Could not create the project.')
    onCreated(data as string)
  }
  return (
    <div className="fixed inset-0 z-50 flex animate-fade-in items-end justify-center bg-black/60 backdrop-blur-sm sm:items-center sm:p-4" role="dialog" aria-modal="true" aria-label="New project">
      <div className="panel flex max-h-[90dvh] w-full max-w-md animate-pop flex-col rounded-b-none p-5 sm:rounded-b-3xl">
        <div className="flex items-center justify-between"><h2 className="font-display text-xl font-bold">New project</h2><button onClick={onClose} aria-label="Close" className="rounded-xl p-2 hover:bg-white/5"><X size={18} /></button></div>
        <input className="field mt-3" placeholder="Project name" aria-label="Project name" value={name} maxLength={80} onChange={(e) => setName(e.target.value)} />
        <textarea className="field mt-2 min-h-[72px]" placeholder="What are you building?" aria-label="Description" value={desc} maxLength={1000} onChange={(e) => setDesc(e.target.value)} />
        <p className="mt-3 text-sm text-mute">Add people (a project chat is created for everyone)</p>
        <ul className="mt-1 min-h-[6rem] flex-1 overflow-y-auto">
          {people.map((u) => (
            <li key={u.id}><label className="flex cursor-pointer items-center gap-3 rounded-xl px-2 py-2 hover:bg-white/5">
              <Avatar path={u.avatar_path} name={u.display_name} size={32} /><span className="flex-1 truncate text-sm">{u.display_name}</span>
              <input type="checkbox" checked={picked.includes(u.id)} onChange={() => setPicked((p) => p.includes(u.id) ? p.filter((x) => x !== u.id) : [...p, u.id])} />
            </label></li>
          ))}
          {people.length === 0 && <li className="p-2 text-sm text-mute">No one else has joined yet. You can add people later.</li>}
        </ul>
        {error && <p role="alert" className="mt-2 text-sm text-bad">{error}</p>}
        <button className="btn-primary mt-3 w-full" onClick={create} disabled={busy}>{busy ? 'Creating…' : 'Create project'}</button>
      </div>
    </div>
  )
}

function PlanDialog({ project, tasks, onClose, onAdded }: { project: Project; tasks: Task[]; onClose: () => void; onAdded: () => void }) {
  const [extra, setExtra] = useState('')
  const [busy, setBusy] = useState(false)
  const [ideas, setIdeas] = useState<string[]>([])
  const [sel, setSel] = useState<Set<number>>(new Set())
  const [error, setError] = useState<string | null>(null)

  async function generate() {
    setBusy(true); setError(null); setIdeas([])
    const message = `You are helping a small group plan a project.\nProject: ${project.name}\nDescription: ${project.description ?? '(none)'}\nExisting tasks: ${tasks.map((t) => t.title).join('; ') || '(none)'}\nExtra context: ${extra || '(none)'}\n\nReturn ONLY a JSON array of 6 to 10 short, concrete task titles (strings). No other text.`
    let acc = ''
    try {
      await callAssistant({ mode: 'private', message: message.slice(0, 7500) }, (e) => { if (e.delta) acc += e.delta; if (e.error) setError(e.error) })
      const m = acc.match(/\[[\s\S]*\]/)
      const arr = m ? (JSON.parse(m[0]) as unknown[]) : []
      const titles = arr.filter((x): x is string => typeof x === 'string' && x.trim().length > 0).map((x) => x.trim().slice(0, 200)).slice(0, 12)
      if (!titles.length) setError('The assistant did not return a usable plan. Try again with more detail.')
      setIdeas(titles); setSel(new Set(titles.map((_, i) => i)))
    } catch (e) { setError(e instanceof Error ? e.message : 'The assistant is unavailable.') }
    setBusy(false)
  }
  async function add() {
    const rows = ideas.filter((_, i) => sel.has(i)).map((title) => ({ project_id: project.id, title }))
    if (!rows.length) return
    const { error } = await supabase.from('tasks').insert(rows)
    if (error) return setError('Could not add the tasks.')
    onAdded(); onClose()
  }
  return (
    <div className="fixed inset-0 z-50 flex animate-fade-in items-end justify-center bg-black/60 backdrop-blur-sm sm:items-center sm:p-4" role="dialog" aria-modal="true" aria-label="Plan with AI">
      <div className="panel flex max-h-[90dvh] w-full max-w-lg animate-pop flex-col rounded-b-none p-5 sm:rounded-b-3xl">
        <div className="flex items-center justify-between"><h2 className="flex items-center gap-2 font-display text-xl font-bold"><Sparkles size={18} className="text-accent" />Plan with AI</h2><button onClick={onClose} aria-label="Close" className="rounded-xl p-2 hover:bg-white/5"><X size={18} /></button></div>
        <p className="mt-1 text-sm text-mute">The assistant suggests tasks from the project description. Your project text is sent to Groq. Pick what to add.</p>
        <textarea className="field mt-3 min-h-[64px]" placeholder="Anything else it should know? (optional)" value={extra} maxLength={1000} onChange={(e) => setExtra(e.target.value)} />
        <button className="btn-quiet mt-2" onClick={generate} disabled={busy}>{busy ? 'Thinking…' : ideas.length ? 'Regenerate' : 'Suggest tasks'}</button>
        {error && <p role="alert" className="mt-2 text-sm text-bad">{error}</p>}
        <ul className="mt-3 min-h-0 flex-1 space-y-1 overflow-y-auto">
          {ideas.map((t, i) => (
            <li key={i}><label className="flex cursor-pointer items-start gap-3 rounded-xl px-2 py-2 hover:bg-white/5">
              <input type="checkbox" className="mt-1" checked={sel.has(i)} onChange={() => setSel((s) => { const n = new Set(s); if (n.has(i)) n.delete(i); else n.add(i); return n })} /><span className="text-sm">{t}</span>
            </label></li>
          ))}
        </ul>
        {ideas.length > 0 && <button className="btn-primary mt-3" onClick={add} disabled={sel.size === 0}>Add {sel.size} task{sel.size === 1 ? '' : 's'}</button>}
      </div>
    </div>
  )
}

function ProjectDetail({ project, onBack, onOpenChat, onChanged }: { project: Project; onBack: () => void; onOpenChat: (id: string) => void; onChanged: () => void }) {
  const { session } = useAuth()
  const me = session!.user.id
  const { users, list } = useDirectory()
  const [tab, setTab] = useState<'tasks' | 'ideas' | 'links' | 'team'>('tasks')
  const [tasks, setTasks] = useState<Task[]>([])
  const [ideas, setIdeas] = useState<Idea[]>([])
  const [votes, setVotes] = useState<Vote[]>([])
  const [links, setLinks] = useState<LinkRow[]>([])
  const [members, setMembers] = useState<PMember[]>([])
  const [newTask, setNewTask] = useState('')
  const [newIdea, setNewIdea] = useState('')
  const [linkTitle, setLinkTitle] = useState('')
  const [linkUrl, setLinkUrl] = useState('')
  const [error, setError] = useState<string | null>(null)
  const [plan, setPlan] = useState(false)
  const busyRef = useRef(false)

  const loadAll = useCallback(async () => {
    if (busyRef.current) return
    busyRef.current = true
    const [t, i, l, m] = await Promise.all([
      supabase.from('tasks').select('id, project_id, title, status, assignee_id, due_date').eq('project_id', project.id).order('created_at'),
      supabase.from('ideas').select('id, content, created_by, created_at').eq('project_id', project.id).order('created_at', { ascending: false }),
      supabase.from('project_links').select('id, title, url, created_by').eq('project_id', project.id).order('created_at', { ascending: false }),
      supabase.from('project_members').select('user_id, role').eq('project_id', project.id),
    ])
    setTasks((t.data as Task[] | null) ?? []); setLinks((l.data as LinkRow[] | null) ?? []); setMembers((m.data as PMember[] | null) ?? [])
    const ideaRows = (i.data as Idea[] | null) ?? []
    setIdeas(ideaRows)
    if (ideaRows.length) {
      const { data: v } = await supabase.from('idea_votes').select('idea_id, user_id').in('idea_id', ideaRows.map((x) => x.id))
      setVotes((v as Vote[] | null) ?? [])
    } else setVotes([])
    busyRef.current = false
  }, [project.id])

  useEffect(() => {
    void loadAll()
    const t = setInterval(() => { void loadAll() }, 15_000)
    return () => clearInterval(t)
  }, [loadAll])

  const isOwner = members.some((m) => m.user_id === me && m.role === 'owner')
  const name = (id: string | null) => (id ? users[id]?.display_name ?? 'Someone' : 'Unassigned')
  const fail = (what: string) => setError(`Could not ${what}.`)

  async function addTask() {
    const title = newTask.trim(); if (!title) return
    const { error } = await supabase.from('tasks').insert({ project_id: project.id, title })
    if (error) return fail('add that task'); setNewTask(''); await loadAll(); onChanged()
  }
  async function patchTask(id: string, patch: Partial<Pick<Task, 'status' | 'assignee_id' | 'due_date'>>) {
    setTasks((p) => p.map((t) => (t.id === id ? { ...t, ...patch } : t)))
    const { error } = await supabase.from('tasks').update(patch).eq('id', id)
    if (error) { fail('update that task'); await loadAll() } else onChanged()
  }
  async function moveTask(t: Task, dir: 1 | -1) {
    const idx = COLS.findIndex((c) => c.id === t.status) + dir
    if (idx >= 0 && idx < COLS.length) await patchTask(t.id, { status: COLS[idx].id })
  }
  async function delTask(id: string) { await supabase.from('tasks').delete().eq('id', id); await loadAll(); onChanged() }

  async function addIdea() {
    const content = newIdea.trim(); if (!content) return
    const { error } = await supabase.from('ideas').insert({ project_id: project.id, content })
    if (error) return fail('post that idea'); setNewIdea(''); await loadAll()
  }
  async function toggleVote(i: Idea) {
    const mine = votes.some((v) => v.idea_id === i.id && v.user_id === me)
    if (mine) await supabase.from('idea_votes').delete().eq('idea_id', i.id).eq('user_id', me)
    else await supabase.from('idea_votes').insert({ idea_id: i.id })
    await loadAll()
  }
  async function delIdea(id: string) { await supabase.from('ideas').delete().eq('id', id); await loadAll() }

  async function addLink() {
    const title = linkTitle.trim(), url = linkUrl.trim()
    if (!title || !/^https?:\/\/\S+$/i.test(url)) return setError('Enter a title and a link starting with http:// or https://')
    const { error } = await supabase.from('project_links').insert({ project_id: project.id, title, url })
    if (error) return fail('add that link'); setLinkTitle(''); setLinkUrl(''); setError(null); await loadAll()
  }
  async function delLink(id: string) { await supabase.from('project_links').delete().eq('id', id); await loadAll() }

  async function addMember(id: string) {
    const { error } = await supabase.from('project_members').insert({ project_id: project.id, user_id: id, role: 'member' })
    if (error) fail('add that person'); await loadAll()
  }
  async function removeMember(id: string) {
    if (!window.confirm(id === me ? 'Leave this project?' : 'Remove this person from the project?')) return
    const { error } = await supabase.from('project_members').delete().eq('project_id', project.id).eq('user_id', id)
    if (error) return fail('remove that person')
    if (id === me) { onChanged(); onBack() } else await loadAll()
  }
  async function toggleArchive() {
    await supabase.from('projects').update({ status: project.status === 'active' ? 'archived' : 'active' }).eq('id', project.id)
    onChanged(); onBack()
  }
  async function deleteProject() {
    if (!window.confirm(`Delete "${project.name}" and all its tasks, ideas and links? The chat stays.`)) return
    const { error } = await supabase.from('projects').delete().eq('id', project.id)
    if (error) return fail('delete the project'); onChanged(); onBack()
  }

  const nonMembers = list.filter((u) => !members.some((m) => m.user_id === u.id))
  const sortedIdeas = [...ideas].sort((a, b) => votes.filter((v) => v.idea_id === b.id).length - votes.filter((v) => v.idea_id === a.id).length)

  return (
    <div className="mx-auto h-full w-full max-w-5xl overflow-y-auto p-4 pb-10 sm:p-8">
      <button onClick={onBack} className="mb-3 flex items-center gap-2 rounded-xl p-1.5 text-sm text-mute hover:text-fg"><ArrowLeft size={16} />All projects</button>
      <div className="flex flex-wrap items-start gap-3">
        <div className="min-w-0 flex-1">
          <h2 className="font-display text-2xl font-bold">{project.name}{project.status === 'archived' && <span className="ml-2 rounded-full bg-white/10 px-2 py-0.5 align-middle text-xs font-normal text-mute">Archived</span>}</h2>
          {project.description && <p className="mt-1 whitespace-pre-wrap text-sm text-mute">{project.description}</p>}
        </div>
        <div className="flex flex-wrap gap-2">
          {project.conversation_id && <button className="btn-quiet" onClick={() => onOpenChat(project.conversation_id!)}><MessageCircle size={16} />Project chat</button>}
          <button className="btn-primary" onClick={() => setPlan(true)}><Sparkles size={16} />Plan with AI</button>
        </div>
      </div>

      <div role="tablist" className="mt-5 flex gap-1 overflow-x-auto rounded-xl border border-white/10 p-1 text-sm">
        {([['tasks', `Tasks (${tasks.length})`], ['ideas', `Ideas (${ideas.length})`], ['links', `Links (${links.length})`], ['team', `People (${members.length})`]] as ['tasks' | 'ideas' | 'links' | 'team', string][]).map(([id, label]) => (
          <button key={id} role="tab" aria-selected={tab === id} onClick={() => setTab(id)} className={`shrink-0 rounded-lg px-4 py-2 font-medium transition ${tab === id ? 'bg-white/10 text-fg' : 'text-mute hover:text-fg'}`}>{label}</button>
        ))}
      </div>
      {error && <p role="alert" className="mt-3 text-sm text-bad">{error}</p>}

      {tab === 'tasks' && (
        <div className="mt-4">
          <form onSubmit={(e) => { e.preventDefault(); void addTask() }} className="flex gap-2">
            <input className="field" placeholder="Add a task and press Enter" aria-label="New task" value={newTask} maxLength={200} onChange={(e) => setNewTask(e.target.value)} />
            <button className="btn-primary" aria-label="Add task"><Plus size={18} /></button>
          </form>
          <div className="mt-4 grid gap-3 md:grid-cols-3">
            {COLS.map((col) => (
              <div key={col.id} className="rounded-2xl border border-white/10 bg-white/[0.03] p-3">
                <h3 className="mb-2 flex items-center justify-between text-xs font-semibold uppercase tracking-wide text-mute">{col.label}<span>{tasks.filter((t) => t.status === col.id).length}</span></h3>
                <ul className="space-y-2">
                  {tasks.filter((t) => t.status === col.id).map((t) => (
                    <li key={t.id} className="rounded-xl border border-white/10 bg-surface p-3">
                      <p className={`break-words text-sm ${t.status === 'done' ? 'text-mute line-through' : ''}`}>{t.title}</p>
                      <div className="mt-2 flex flex-wrap items-center gap-1.5">
                        <select aria-label="Assignee" className="field !w-auto !rounded-lg !py-1 text-xs" value={t.assignee_id ?? ''} onChange={(e) => void patchTask(t.id, { assignee_id: e.target.value || null })}>
                          <option value="">Unassigned</option>{members.map((m) => <option key={m.user_id} value={m.user_id}>{name(m.user_id)}</option>)}
                        </select>
                        <input type="date" aria-label="Due date" className="field !w-auto !rounded-lg !py-1 text-xs" value={t.due_date ?? ''} onChange={(e) => void patchTask(t.id, { due_date: e.target.value || null })} />
                      </div>
                      <div className="mt-2 flex items-center gap-1">
                        <button className="rounded-lg p-1.5 text-mute hover:bg-white/10 disabled:opacity-30" disabled={col.id === 'todo'} onClick={() => moveTask(t, -1)} aria-label="Move back"><ArrowLeft size={14} /></button>
                        <button className="rounded-lg p-1.5 text-mute hover:bg-white/10 disabled:opacity-30" disabled={col.id === 'done'} onClick={() => moveTask(t, 1)} aria-label="Move forward"><ArrowRight size={14} /></button>
                        <button className="ml-auto rounded-lg p-1.5 text-mute hover:bg-white/10 hover:text-bad" onClick={() => delTask(t.id)} aria-label="Delete task"><Trash2 size={14} /></button>
                      </div>
                    </li>
                  ))}
                </ul>
              </div>
            ))}
          </div>
        </div>
      )}

      {tab === 'ideas' && (
        <div className="mt-4">
          <form onSubmit={(e) => { e.preventDefault(); void addIdea() }} className="flex gap-2">
            <input className="field" placeholder="Share an idea" aria-label="New idea" value={newIdea} maxLength={500} onChange={(e) => setNewIdea(e.target.value)} />
            <button className="btn-primary">Post</button>
          </form>
          {sortedIdeas.length === 0 && <p className="mt-6 text-center text-sm text-mute">No ideas yet. Post the first one.</p>}
          <ul className="mt-4 space-y-2">
            {sortedIdeas.map((i) => {
              const n = votes.filter((v) => v.idea_id === i.id).length
              const mine = votes.some((v) => v.idea_id === i.id && v.user_id === me)
              return (
                <li key={i.id} className="panel flex items-start gap-3 !rounded-2xl p-3">
                  <button onClick={() => toggleVote(i)} aria-pressed={mine} aria-label="Vote for this idea" className={`flex shrink-0 flex-col items-center rounded-xl px-3 py-1.5 text-xs transition ${mine ? 'bg-accent/20 text-accent' : 'bg-white/5 text-mute hover:text-fg'}`}><ThumbsUp size={16} />{n}</button>
                  <div className="min-w-0 flex-1"><p className="break-words text-sm">{i.content}</p><p className="mt-0.5 text-xs text-mute">{name(i.created_by)} · {new Date(i.created_at).toLocaleDateString()}</p></div>
                  {(i.created_by === me || isOwner) && <button onClick={() => delIdea(i.id)} aria-label="Delete idea" className="rounded-lg p-1.5 text-mute hover:bg-white/10 hover:text-bad"><Trash2 size={14} /></button>}
                </li>
              )
            })}
          </ul>
        </div>
      )}

      {tab === 'links' && (
        <div className="mt-4">
          <form onSubmit={(e) => { e.preventDefault(); void addLink() }} className="grid gap-2 sm:grid-cols-[1fr_2fr_auto]">
            <input className="field" placeholder="Title" aria-label="Link title" value={linkTitle} maxLength={100} onChange={(e) => setLinkTitle(e.target.value)} />
            <input className="field" placeholder="https://…" aria-label="Link address" value={linkUrl} maxLength={500} onChange={(e) => setLinkUrl(e.target.value)} />
            <button className="btn-primary">Add</button>
          </form>
          {links.length === 0 && <p className="mt-6 text-center text-sm text-mute">Save repos, designs, docs and anything else the team needs.</p>}
          <ul className="mt-4 space-y-2">
            {links.map((l) => (
              <li key={l.id} className="panel flex items-center gap-3 !rounded-2xl p-3">
                <Link2 size={18} className="shrink-0 text-accent" />
                <a href={l.url} target="_blank" rel="noopener noreferrer" className="min-w-0 flex-1"><span className="block truncate text-sm font-medium">{l.title}</span><span className="block truncate text-xs text-mute">{l.url}</span></a>
                <a href={l.url} target="_blank" rel="noopener noreferrer" aria-label={`Open ${l.title}`} className="rounded-lg p-1.5 text-mute hover:bg-white/10"><ExternalLink size={14} /></a>
                {(l.created_by === me || isOwner) && <button onClick={() => delLink(l.id)} aria-label="Delete link" className="rounded-lg p-1.5 text-mute hover:bg-white/10 hover:text-bad"><Trash2 size={14} /></button>}
              </li>
            ))}
          </ul>
        </div>
      )}

      {tab === 'team' && (
        <div className="mt-4">
          <ul className="space-y-1">
            {members.map((m) => (
              <li key={m.user_id} className="panel flex items-center gap-3 !rounded-2xl p-3">
                <Avatar path={users[m.user_id]?.avatar_path} name={name(m.user_id)} size={36} />
                <span className="min-w-0 flex-1 truncate text-sm">{name(m.user_id)}{m.user_id === me ? ' (you)' : ''}</span>
                <span className="text-xs text-mute">{m.role === 'owner' ? 'Owner' : 'Member'}</span>
                {m.role !== 'owner' && (isOwner || m.user_id === me) && <button className="text-xs text-bad" onClick={() => removeMember(m.user_id)}>{m.user_id === me ? 'Leave' : 'Remove'}</button>}
              </li>
            ))}
          </ul>
          {isOwner && nonMembers.length > 0 && (
            <label className="mt-4 block text-sm"><span className="mb-1 flex items-center gap-1.5 text-mute"><UserPlus size={14} />Add someone</span>
              <select className="field" value="" onChange={(e) => e.target.value && void addMember(e.target.value)}><option value="">Choose…</option>{nonMembers.map((u) => <option key={u.id} value={u.id}>{u.display_name}</option>)}</select></label>
          )}
          {isOwner && (
            <div className="mt-8 flex flex-wrap gap-2 border-t border-white/10 pt-4">
              <button className="btn-quiet" onClick={toggleArchive}><Archive size={16} />{project.status === 'active' ? 'Archive project' : 'Restore project'}</button>
              <button className="btn-quiet text-bad" onClick={deleteProject}><Trash2 size={16} />Delete project</button>
            </div>
          )}
        </div>
      )}
      {plan && <PlanDialog project={project} tasks={tasks} onClose={() => setPlan(false)} onAdded={() => { void loadAll(); onChanged() }} />}
    </div>
  )
}

function ProjectsView({ onOpenChat }: { onOpenChat: (conversationId: string) => void }) {
  const [projects, setProjects] = useState<Project[] | null>(null)
  const [counts, setCounts] = useState<Record<string, { total: number; done: number }>>({})
  const [openId, setOpenId] = useState<string | null>(null)
  const [showNew, setShowNew] = useState(false)
  const [showArchived, setShowArchived] = useState(false)

  const load = useCallback(async () => {
    const [p, t] = await Promise.all([
      supabase.from('projects').select('id, name, description, status, conversation_id, created_by, created_at').order('created_at', { ascending: false }),
      supabase.from('tasks').select('project_id, status'),
    ])
    setProjects((p.data as Project[] | null) ?? [])
    const c: Record<string, { total: number; done: number }> = {}
    for (const r of (t.data as { project_id: string; status: string }[] | null) ?? []) {
      c[r.project_id] ??= { total: 0, done: 0 }
      c[r.project_id].total++
      if (r.status === 'done') c[r.project_id].done++
    }
    setCounts(c)
  }, [])
  useEffect(() => { void load() }, [load])

  const open = projects?.find((p) => p.id === openId)
  if (open) return <ProjectDetail project={open} onBack={() => setOpenId(null)} onOpenChat={onOpenChat} onChanged={() => void load()} />

  const shown = (projects ?? []).filter((p) => (p.status === 'archived') === showArchived)
  return (
    <section className="mx-auto h-full w-full max-w-4xl overflow-y-auto p-4 pb-10 sm:p-8">
      <div className="flex items-center gap-3">
        <h2 className="flex-1 font-display text-2xl font-bold">Projects</h2>
        <button className="btn-primary" onClick={() => setShowNew(true)}><Plus size={16} />New project</button>
      </div>
      <p className="mt-1 text-sm text-mute">Plan, assign and track what you are building together. Every project gets its own chat.</p>
      <div className="mt-4 flex gap-2 text-sm">
        <button onClick={() => setShowArchived(false)} aria-pressed={!showArchived} className={`rounded-full px-3.5 py-1.5 ${!showArchived ? 'bg-accent font-semibold text-ink' : 'bg-white/5 text-mute'}`}>Active</button>
        <button onClick={() => setShowArchived(true)} aria-pressed={showArchived} className={`rounded-full px-3.5 py-1.5 ${showArchived ? 'bg-accent font-semibold text-ink' : 'bg-white/5 text-mute'}`}>Archived</button>
      </div>
      {projects === null && <div className="mt-5 grid gap-3 sm:grid-cols-2">{[0, 1].map((i) => <div key={i} className="h-32 animate-pulse rounded-2xl bg-white/5" />)}</div>}
      {projects && shown.length === 0 && (
        <div className="mt-12 text-center text-sm text-mute"><FolderKanban className="mx-auto mb-2 text-accent" size={32} />{showArchived ? 'Nothing archived.' : 'No projects yet. Start one and invite the people you build with.'}</div>
      )}
      <ul className="mt-5 grid gap-3 sm:grid-cols-2">
        {shown.map((p) => {
          const c = counts[p.id] ?? { total: 0, done: 0 }
          const pct = c.total ? Math.round((c.done / c.total) * 100) : 0
          return (
            <li key={p.id}>
              <button onClick={() => setOpenId(p.id)} className="panel block h-full w-full !rounded-2xl p-4 text-left transition hover:border-accent/50">
                <h3 className="truncate font-display text-lg font-bold">{p.name}</h3>
                <p className="mt-1 line-clamp-2 min-h-[2.5rem] text-sm text-mute">{p.description || 'No description'}</p>
                <div className="mt-3 h-1.5 overflow-hidden rounded-full bg-white/10"><div className="h-full rounded-full bg-gradient-to-r from-accent to-indigo-400" style={{ width: `${pct}%` }} /></div>
                <p className="mt-1.5 text-xs text-mute">{c.total ? `${c.done} of ${c.total} tasks done` : 'No tasks yet'}</p>
              </button>
            </li>
          )
        })}
      </ul>
      {showNew && <NewProjectDialog onClose={() => setShowNew(false)} onCreated={(id) => { setShowNew(false); void load().then(() => setOpenId(id)) }} />}
    </section>
  )
}

function Toggle({ on, onChange, label, hint, disabled }: { on: boolean; onChange: (v: boolean) => void; label: string; hint?: string; disabled?: boolean }) {
  return (
    <button role="switch" aria-checked={on} disabled={disabled} onClick={() => onChange(!on)}
      className="flex w-full items-center justify-between gap-4 rounded-xl px-3 py-3 text-left transition hover:bg-white/5 disabled:opacity-50">
      <span><span className="block text-sm font-medium">{label}</span>{hint && <span className="block text-xs text-mute">{hint}</span>}</span>
      <span className={`relative h-6 w-11 shrink-0 rounded-full transition ${on ? 'bg-accent' : 'bg-white/15'}`}>
        <span className={`absolute top-0.5 h-5 w-5 rounded-full bg-white transition-all ${on ? 'left-[22px]' : 'left-0.5'}`} />
      </span>
    </button>
