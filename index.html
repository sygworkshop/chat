}

function SettingsView() {
  const { profile, session, refresh, signOut } = useAuth()
  const [name, setName] = useState(profile?.display_name ?? '')
  const [bio, setBio] = useState(profile?.bio ?? '')
  const [msg, setMsg] = useState<{ ok: boolean; text: string } | null>(null)
  const [busy, setBusy] = useState(false)
  const fileRef = useRef<HTMLInputElement>(null)
  const prefs = readPrefs(profile?.notification_prefs)
  const perm = notifySupported() ? Notification.permission : 'denied'

  async function saveProfile() {
    if (!profile) return
    if (!name.trim()) return setMsg({ ok: false, text: 'Your name cannot be empty.' })
    setBusy(true)
    const { error } = await supabase.from('profiles').update({ display_name: name.trim().slice(0, 60), bio: bio.trim().slice(0, 500) || null }).eq('id', profile.id)
    setBusy(false)
    if (error) return setMsg({ ok: false, text: 'Could not save your profile.' })
    await refresh(); setMsg({ ok: true, text: 'Profile saved.' })
  }

  async function onPhoto(picked: File | undefined) {
    if (!picked || !session) return
    if (!['image/png', 'image/jpeg', 'image/webp'].includes(picked.type)) return setMsg({ ok: false, text: 'Choose a PNG, JPEG, or WebP image.' })
    setBusy(true); setMsg(null)
    try {
      const file = await compressImage(picked, 512, 0.85)
      const path = `${session.user.id}/avatar-${Date.now()}.jpg`
      const up = await supabase.storage.from('avatars').upload(path, file, { contentType: 'image/jpeg' })
      if (up.error) throw up.error
      const { error } = await supabase.from('profiles').update({ avatar_path: path }).eq('id', session.user.id)
      if (error) throw error
      await refresh(); setMsg({ ok: true, text: 'Photo updated.' })
    } catch { setMsg({ ok: false, text: 'Could not update your photo.' }) }
    setBusy(false)
  }

  async function savePrefs(patch: Partial<NotifyPrefs>) {
    if (!profile) return
    const next = { ...prefs, ...patch }
    const { error } = await supabase.from('profiles').update({ notification_prefs: next }).eq('id', profile.id)
    if (error) setMsg({ ok: false, text: 'Could not save that setting.' }); else await refresh()
  }

  async function toggleBrowser(on: boolean) {
    if (!on) return savePrefs({ browser: false })
    const result = await askPermission()
    if (result !== 'granted') return setMsg({ ok: false, text: 'Your browser blocked notifications. Allow them for this site in the browser settings, then try again.' })
    await savePrefs({ browser: true })
  }

  return (
    <section className="mx-auto h-full w-full max-w-2xl space-y-5 overflow-y-auto p-4 pb-10 sm:p-8">
      <h2 className="font-display text-2xl font-bold">Settings</h2>
      {msg && <p role="status" className={`rounded-xl px-4 py-2.5 text-sm ${msg.ok ? 'bg-ok/10 text-ok' : 'bg-bad/10 text-bad'}`}>{msg.text}</p>}

      <div className="panel p-5">
        <h3 className="font-display text-lg font-bold">Profile</h3>
        <div className="mt-4 flex items-center gap-4">
          {profile && <Avatar path={profile.avatar_path} name={profile.display_name} size={64} />}
          <div>
            <input ref={fileRef} type="file" hidden accept="image/png,image/jpeg,image/webp" onChange={(e) => void onPhoto(e.target.files?.[0])} />
            <button className="btn-quiet" onClick={() => fileRef.current?.click()} disabled={busy}>Change photo</button>
            <p className="mt-1 text-xs text-mute">@{profile?.username}</p>
          </div>
        </div>
        <label className="mt-4 block text-sm"><span className="mb-1 block text-mute">Display name</span><input className="field" value={name} maxLength={60} onChange={(e) => setName(e.target.value)} /></label>
        <label className="mt-3 block text-sm"><span className="mb-1 block text-mute">About you</span><textarea className="field min-h-[72px]" value={bio} maxLength={500} onChange={(e) => setBio(e.target.value)} /></label>
        <button className="btn-primary mt-4" onClick={saveProfile} disabled={busy}>Save profile</button>
      </div>

      <div className="panel p-5">
        <h3 className="flex items-center gap-2 font-display text-lg font-bold"><Bell size={18} className="text-accent" />Notifications</h3>
        <p className="mt-1 text-sm text-mute">Alerts appear while Common Room is open in a tab, including a background tab. Closed apps cannot notify yet.</p>
        <div className="mt-3 space-y-1">
          <Toggle on={prefs.browser && perm === 'granted'} onChange={toggleBrowser} disabled={!notifySupported()} label="Desktop and phone notifications" hint={!notifySupported() ? 'This browser does not support notifications.' : perm === 'denied' ? 'Blocked in your browser settings.' : 'Shows a system alert when a message arrives and the tab is hidden.'} />
          <Toggle on={prefs.sound} onChange={(v) => savePrefs({ sound: v })} label="Sound" hint="A soft beep for new messages." />
          <Toggle on={prefs.preview} onChange={(v) => savePrefs({ preview: v })} label="Show message text in alerts" hint="Turn off to show only “New message”." />
        </div>
        <p className="mt-3 text-xs text-mute">Mute a single chat from its Details panel.</p>
      </div>

      <div className="panel p-5">
        <h3 className="flex items-center gap-2 font-display text-lg font-bold"><ShieldCheck size={18} className="text-accent" />Privacy and data</h3>
        <ul className="mt-3 list-disc space-y-1.5 pl-5 text-sm text-mute">
          <li>Messages are protected in transit and at rest, but they are <strong className="text-fg">not end-to-end encrypted</strong>. Anyone with database access to this project can technically read them.</li>
          <li>Disappearing messages are deleted from the database and their files are removed. Messages marked important are kept.</li>
          <li>The AI assistant sends only the text needed for your request to Groq, an outside service.</li>
          <li>Video calls connect your devices directly. Signalling goes through this app; the video itself does not.</li>
          <li>Others in a chat can see when you have read their messages.</li>
        </ul>
      </div>

      <div className="panel p-5">
        <h3 className="font-display text-lg font-bold">Account</h3>
        <p className="mt-2 text-sm text-mute">Signed in as {session?.user.email}</p>
        <p className="mt-1 text-sm text-mute">To delete your account and data, ask an admin to remove it.</p>
        <button className="btn-quiet mt-4" onClick={signOut}><LogOut size={16} />Sign out</button>
      </div>
    </section>
  )
}

// ---- src/features/approvals/AdminInbox.tsx ----

interface Row {
  id: string
  applicant_id: string
  intro: string | null
  status: 'pending' | 'approved' | 'rejected'
  created_at: string
  decided_at: string | null
  rejection_reason: string | null
  profiles: { username: string; display_name: string; avatar_path: string | null } | null
}

function AdminInbox() {
  const [rows, setRows] = useState<Row[] | null>(null)
  const [error, setError] = useState<string | null>(null)
  const [busyId, setBusyId] = useState<string | null>(null)
  const [rejecting, setRejecting] = useState<string | null>(null)
  const [reason, setReason] = useState('')

  const load = useCallback(async () => {
    const { data, error } = await supabase
      .from('approval_requests')
      .select('id, applicant_id, intro, status, created_at, decided_at, rejection_reason, profiles:applicant_id(username, display_name, avatar_path)')
      .order('created_at', { ascending: false }).limit(100)
    if (error) setError('Could not load requests.')
    else setRows(data as unknown as Row[])
  }, [])

  useEffect(() => {
    void load()
    const ch = supabase.channel('approval-inbox')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'approval_requests' }, () => { void load() })
      .subscribe()
    return () => { void supabase.removeChannel(ch) }
  }, [load])

  async function decide(row: Row, decision: 'approved' | 'rejected') {
    setBusyId(row.id); setError(null)
    const { error } = await supabase.rpc('review_application', {
      p_applicant: row.applicant_id, p_decision: decision, p_reason: decision === 'rejected' ? reason.trim() || null : null,
    })
    if (error) {
      const m = error.message
      setError(/already decided/.test(m) ? 'Someone else already reviewed this request.'
        : /own application/.test(m) ? 'You cannot review your own request.'
        : /not authorized/.test(m) ? 'Only approved admins can do that.'
        : 'Something went wrong. Reload the page and try again.')
    }
    setBusyId(null); setRejecting(null); setReason('')
    await load()
  }

  const pending = rows?.filter((r) => r.status === 'pending') ?? []
  const decided = rows?.filter((r) => r.status !== 'pending') ?? []

  return (
    <section className="mx-auto w-full max-w-2xl p-4 sm:p-8">
      <h2 className="font-display text-2xl font-bold">Admin Bot</h2>
      <p className="mt-1 text-sm text-mute">Requests to join appear here. Approving someone makes them a member and, with the current setting, an admin too.</p>
      {error && <p role="alert" className="mt-4 text-sm text-bad">{error}</p>}
      {rows === null && <div className="mt-6 h-24 animate-pulse rounded-2xl bg-raised" />}
      {rows && pending.length === 0 && <p className="mt-6 rounded-2xl border border-dashed border-line p-6 text-sm text-mute">No one is waiting. New requests show up here instantly.</p>}

      <ul className="mt-6 space-y-3">
        {pending.map((r) => (
          <li key={r.id} className="panel p-4">
            <div className="flex items-start gap-3">
              <Avatar path={r.profiles?.avatar_path} name={r.profiles?.display_name ?? '?'} size={44} />
              <div className="min-w-0 flex-1 text-sm">
                <p className="font-semibold">New join request: @{r.profiles?.username} has asked for access.</p>
                <p className="text-mute">{r.profiles?.display_name} · {new Date(r.created_at).toLocaleString()}</p>
                {r.intro && <p className="mt-2 break-words">{r.intro}</p>}
              </div>
            </div>
            {rejecting === r.id ? (
              <div className="mt-3 flex flex-col gap-2 sm:flex-row">
                <input className="field" placeholder="Reason (optional)" value={reason} maxLength={300} onChange={(e) => setReason(e.target.value)} />
                <button className="btn-quiet" onClick={() => decide(r, 'rejected')} disabled={busyId === r.id}>Confirm decline</button>
                <button className="btn-quiet" onClick={() => setRejecting(null)}>Cancel</button>
              </div>
            ) : (
              <div className="mt-3 flex gap-2">
                <button className="btn-primary" onClick={() => decide(r, 'approved')} disabled={busyId === r.id}><Check size={16} />Approve</button>
                <button className="btn-quiet" onClick={() => setRejecting(r.id)} disabled={busyId === r.id}><X size={16} />Decline</button>
              </div>
            )}
          </li>
        ))}
      </ul>

      {decided.length > 0 && (
        <>
          <h3 className="mt-10 text-sm font-semibold text-mute">Reviewed</h3>
          <ul className="mt-2 divide-y divide-line rounded-2xl border border-line">
            {decided.map((r) => (
              <li key={r.id} className="flex items-center gap-3 p-3 text-sm">
                <Avatar path={r.profiles?.avatar_path} name={r.profiles?.display_name ?? '?'} size={32} />
                <span className="min-w-0 flex-1 truncate">@{r.profiles?.username}</span>
                <span className={r.status === 'approved' ? 'text-ok' : 'text-bad'}>{r.status === 'approved' ? 'Approved' : 'Declined'}</span>
              </li>
            ))}
          </ul>
        </>
      )}
    </section>
  )
}

function AuthScreen() {
  const [mode, setMode] = useState<'signin' | 'signup'>('signin')
  const [email, setEmail] = useState('')
  const [password, setPassword] = useState('')
  const [username, setUsername] = useState('')
  const [displayName, setDisplayName] = useState('')
  const [bio, setBio] = useState('')
  const [busy, setBusy] = useState(false)
  const [error, setError] = useState<string | null>(null)
  const [notice, setNotice] = useState<string | null>(null)

  async function submit(e: FormEvent) {
    e.preventDefault()
    setError(null); setNotice(null)
    if (mode === 'signup') {
      const u = username.trim().toLowerCase()
      if (!/^[a-z0-9_]{3,24}$/.test(u)) return setError('Usernames are 3–24 characters: lowercase letters, numbers, and underscores.')
      if (password.length < 8) return setError('Use a password with at least 8 characters.')
      if (!displayName.trim()) return setError('Add the name people know you by.')
    }
    setBusy(true)
    if (mode === 'signin') {
      const { error } = await supabase.auth.signInWithPassword({ email, password })
      if (error) setError('Email or password is incorrect.')
    } else {
      const { data, error } = await supabase.auth.signUp({
        email, password,
        options: { data: { username: username.trim().toLowerCase(), display_name: displayName.trim(), bio: bio.trim() } },
      })
      if (error) setError(/database error|unique|duplicate/i.test(error.message) ? 'That username or email is already taken.' : error.message)
      else if (!data.session) setNotice('Check your email to confirm your address, then sign in. An existing member will review your request after that.')
    }
    setBusy(false)
  }

  return (
    <main className="flex min-h-full items-center justify-center overflow-y-auto p-4">
      <div className="panel w-full max-w-md animate-pop p-7 sm:p-9">
        <div className="logo-glow mb-5 w-fit rounded-[14px]"><Logo size={52} /></div>
        <h1 className="font-display text-3xl font-bold tracking-tight">Common Room</h1>
        <p className="mt-1.5 text-sm leading-relaxed text-mute">A private place to talk, share and build together. New members are approved by people already inside.</p>

        <div role="tablist" className="mt-6 grid grid-cols-2 rounded-lg border border-line p-1 text-sm">
          {(['signin', 'signup'] as const).map((m) => (
            <button key={m} role="tab" aria-selected={mode === m} onClick={() => setMode(m)}
              className={`rounded-md py-2 font-medium ${mode === m ? 'bg-raised text-fg' : 'text-mute'}`}>
              {m === 'signin' ? 'Sign in' : 'Ask to join'}
            </button>
          ))}
        </div>

        <form onSubmit={submit} className="mt-5 space-y-3">
          {mode === 'signup' && (
            <>
              <label className="block text-sm"><span className="mb-1 block text-mute">Username</span>
                <input className="field" value={username} onChange={(e) => setUsername(e.target.value)} autoComplete="username" required maxLength={24} /></label>
              <label className="block text-sm"><span className="mb-1 block text-mute">Display name</span>
                <input className="field" value={displayName} onChange={(e) => setDisplayName(e.target.value)} required maxLength={60} /></label>
              <label className="block text-sm"><span className="mb-1 block text-mute">Who are you? (so people recognise you)</span>
                <textarea className="field min-h-[72px]" value={bio} onChange={(e) => setBio(e.target.value)} maxLength={500} placeholder="e.g. Sam from college, met through Priya" /></label>
            </>
          )}
          <label className="block text-sm"><span className="mb-1 block text-mute">Email</span>
            <input className="field" type="email" value={email} onChange={(e) => setEmail(e.target.value)} autoComplete="email" required /></label>
          <label className="block text-sm"><span className="mb-1 block text-mute">Password</span>
            <input className="field" type="password" value={password} onChange={(e) => setPassword(e.target.value)} autoComplete={mode === 'signin' ? 'current-password' : 'new-password'} required /></label>

          {error && <p role="alert" className="text-sm text-bad">{error}</p>}
          {notice && <p role="status" className="text-sm text-ok">{notice}</p>}
          <button className="btn-primary w-full" disabled={busy}>{busy ? 'Working…' : mode === 'signin' ? 'Sign in' : 'Send request'}</button>
        </form>
      </div>
    </main>
  )
}

function PendingScreen() {
  const { profile, session, refresh, signOut } = useAuth()
  const [uploading, setUploading] = useState(false)
  const [msg, setMsg] = useState<string | null>(null)
  const [setupOpen, setSetupOpen] = useState(false)
  const [token, setToken] = useState('')
  const [setupMode, setSetupMode] = useState<'bootstrap' | 'recover'>('bootstrap')
  const fileRef = useRef<HTMLInputElement>(null)

  useEffect(() => {
    const t = setInterval(() => { void refresh() }, 10_000)
    return () => clearInterval(t)
  }, [refresh])

  if (!profile || !session) return null
  const status = profile.approval_status

  async function onPhoto(picked: File | undefined) {
    if (!picked || !session) return
    if (!['image/png', 'image/jpeg', 'image/webp'].includes(picked.type)) return setMsg('Choose a PNG, JPEG, or WebP image.')
    setUploading(true); setMsg(null)
    let file: File
    try { file = await compressImage(picked, 512, 0.85) } catch { setUploading(false); return setMsg('Could not read that image.') }
    const path = `${session.user.id}/avatar-${Date.now()}.jpg`
    const up = await supabase.storage.from('avatars').upload(path, file, { contentType: 'image/jpeg' })
    if (up.error) setMsg('Upload failed. Try a different image.')
    else {
      const { error } = await supabase.from('profiles').update({ avatar_path: path }).eq('id', session.user.id)
      if (error) setMsg('Could not save your photo.'); else await refresh()
    }
    setUploading(false)
  }

  async function submitToken() {
    setMsg(null)
    const { error } = await supabase.functions.invoke('admin-bootstrap', { body: { action: setupMode, token } })
    if (error) setMsg('That token was not accepted, or setup is already complete.')
    else { setToken(''); await refresh() }
  }

  const copy = {
    pending: ['Waiting for approval', 'A member will review your request. This page updates on its own.'],
    rejected: ['Request declined', profile.rejection_reason ? `Reason: ${profile.rejection_reason}` : 'Your request was not approved.'],
    banned: ['Account suspended', 'You no longer have access to this community.'],
    approved: ['Approved', 'Loading your space…'],
  }[status]

  return (
    <main className="flex min-h-full items-center justify-center p-4">
      <div className="panel w-full max-w-md p-7">
        <span className={`inline-block rounded-full px-3 py-1 text-xs font-semibold ${status === 'pending' ? 'bg-warn/15 text-warn' : status === 'approved' ? 'bg-ok/15 text-ok' : 'bg-bad/15 text-bad'}`}>
          {status === 'pending' ? 'Pending' : status === 'approved' ? 'Approved' : status === 'rejected' ? 'Declined' : 'Suspended'}
        </span>
        <h1 className="mt-3 font-display text-2xl font-bold">{copy[0]}</h1>
        <p className="mt-1 text-sm text-mute">{copy[1]}</p>

        <div className="mt-6 flex items-start gap-4 rounded-xl border border-line bg-raised p-4">
          <Avatar path={profile.avatar_path} name={profile.display_name} size={56} />
          <div className="min-w-0 text-sm">
            <p className="font-semibold">{profile.display_name}</p>
            <p className="text-mute">@{profile.username}</p>
            {profile.bio && <p className="mt-2 break-words">{profile.bio}</p>}
          </div>
        </div>

        {status === 'pending' && (
          <>
            <input ref={fileRef} type="file" accept="image/png,image/jpeg,image/webp" hidden onChange={(e) => onPhoto(e.target.files?.[0])} />
            <button className="btn-quiet mt-4 w-full" onClick={() => fileRef.current?.click()} disabled={uploading}>
              {uploading ? 'Uploading…' : profile.avatar_path ? 'Change profile photo' : 'Add a profile photo'}
            </button>
          </>
        )}
        {msg && <p role="alert" className="mt-3 text-sm text-bad">{msg}</p>}

        <div className="mt-6 flex items-center justify-between text-sm">
          <button className="text-mute underline-offset-4 hover:underline" onClick={() => setSetupOpen((v) => !v)}>Setting up this community?</button>
          <button className="text-mute underline-offset-4 hover:underline" onClick={signOut}>Sign out</button>
        </div>
        {setupOpen && (
          <div className="mt-3 space-y-2 rounded-xl border border-line p-3">
            <div className="flex gap-2 text-xs">
              {(['bootstrap', 'recover'] as const).map((m) => (
                <button key={m} onClick={() => setSetupMode(m)} className={`rounded-md px-2 py-1 ${setupMode === m ? 'bg-raised text-fg' : 'text-mute'}`}>
                  {m === 'bootstrap' ? 'First admin' : 'Recover admin'}
                </button>
              ))}
            </div>
            <input className="field" type="password" placeholder="Setup token" value={token} onChange={(e) => setToken(e.target.value)} autoComplete="off" />
            <button className="btn-primary w-full" onClick={submitToken} disabled={token.length < 8}>Verify token</button>
          </div>
        )}
      </div>
    </main>
  )
}

// ---- src/components/Shell.tsx ----

type View = 'chats' | 'projects' | 'library' | 'ai' | 'settings' | 'inbox'
interface Toast { id: number; title: string; body: string; convId: string }

function shortTime(iso: string | null): string {
  if (!iso) return ''
  const d = new Date(iso)
  const now = new Date()
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  const days = (now.getTime() - d.getTime()) / 86_400_000
  return days < 7 ? d.toLocaleDateString([], { weekday: 'short' }) : d.toLocaleDateString([], { day: 'numeric', month: 'short' })
}

function Shell() {
  const { profile, session, isAdmin, signOut } = useAuth()
  const me = session!.user.id
  const { users } = useDirectory()
  const [view, setView] = useState<View>('chats')
  const [showContent, setShowContent] = useState(false)
  const [menuOpen, setMenuOpen] = useState(false)
  const [convos, setConvos] = useState<ConversationSummary[] | null>(null)
  const [otherOf, setOtherOf] = useState<Record<string, string>>({})
  const [selectedId, setSelectedId] = useState<string | null>(null)
  const [query, setQuery] = useState('')
  const [pendingCount, setPendingCount] = useState(0)
  const [showNew, setShowNew] = useState(false)
  const [toasts, setToasts] = useState<Toast[]>([])

  const convosRef = useRef<ConversationSummary[] | null>(null); convosRef.current = convos
  const stateRef = useRef({ view, selectedId, titleOf: (c: ConversationSummary) => '' as string })
  const prefsRef = useRef(readPrefs(profile?.notification_prefs)); prefsRef.current = readPrefs(profile?.notification_prefs)

  const loadConvos = useCallback(async () => {
    const { data } = await supabase.rpc('my_conversations')
    const rows = (data as ConversationSummary[] | null) ?? []
    setConvos(rows)
    const directIds = rows.filter((c) => c.type === 'direct').map((c) => c.id)
    if (directIds.length) {
      const { data: mem } = await supabase.from('conversation_members').select('conversation_id, user_id').in('conversation_id', directIds).neq('user_id', me)
      setOtherOf(Object.fromEntries((mem ?? []).map((m) => [m.conversation_id as string, m.user_id as string])))
    }
  }, [me])

  const usersRef = useRef(users); usersRef.current = users

  const loadPending = useCallback(async () => {
    if (!isAdmin) return
    const { count } = await supabase.from('approval_requests').select('id', { count: 'exact', head: true }).eq('status', 'pending')
    setPendingCount(count ?? 0)
  }, [isAdmin])

  useEffect(() => {
    void loadConvos(); void loadPending()
    const ch = supabase.channel('shell')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'approval_requests' }, () => { void loadPending() })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (p) => {
        void loadConvos()
        const m = p.new as { id: string; conversation_id: string; sender_id: string; content: string; message_type: string }
        if (m.sender_id === me || m.message_type === 'assistant') return
        const c = convosRef.current?.find((x) => x.id === m.conversation_id)
        if (c?.muted) return
        const st = stateRef.current
        const viewing = document.visibilityState === 'visible' && st.view === 'chats' && st.selectedId === m.conversation_id
        if (viewing) return
        const prefs = prefsRef.current
        const who = usersRef.current[m.sender_id]?.display_name ?? 'Someone'
        const chat = c ? st.titleOf(c) : 'New message'
        const what = m.message_type === 'system' ? (m.content === 'started a video call' ? 'started a video call' : m.content)
          : m.message_type === 'gif' ? 'sent a GIF' : m.message_type === 'image' ? 'sent a photo' : m.message_type === 'video' ? 'sent a video' : m.message_type === 'file' ? 'sent a file'
          : prefs.preview ? m.content : 'sent a message'
        const body = `${who}: ${what}`
        if (prefs.sound) beep()
        if (document.visibilityState === 'hidden' && prefs.browser) showNotification(chat, body, () => { setSelectedId(m.conversation_id); setView('chats'); setShowContent(true) })
        else if (document.visibilityState === 'visible') {
          const id = Date.now() + Math.random()
          setToasts((t) => [...t.slice(-2), { id, title: chat, body, convId: m.conversation_id }])
          setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 5000)
        }
      })
      .subscribe()
    // New groups you are added to have no message yet, so refresh the list periodically and when the tab regains focus.
    const poll = setInterval(() => { void loadConvos() }, 30_000)
    const onVisible = () => { if (document.visibilityState === 'visible') void loadConvos() }
    document.addEventListener('visibilitychange', onVisible)
    return () => { clearInterval(poll); document.removeEventListener('visibilitychange', onVisible); void supabase.removeChannel(ch) }
  }, [loadConvos, loadPending, me])

  useEffect(() => {
    const purge = () => { void supabase.functions.invoke('purge-expired').catch(() => {}) }
    purge()
    const t = setInterval(purge, 10 * 60_000)
    return () => clearInterval(t)
  }, [])

  useEffect(() => {
    if (!menuOpen) return
    const onKey = (e: KeyboardEvent) => { if (e.key === 'Escape') setMenuOpen(false) }
    window.addEventListener('keydown', onKey)
    return () => window.removeEventListener('keydown', onKey)
  }, [menuOpen])

  const titleOf = (c: ConversationSummary) => c.type === 'group' ? (c.title ?? 'Group') : (users[otherOf[c.id]]?.display_name ?? 'Chat')
  const avatarOf = (c: ConversationSummary) => c.type === 'group' ? c.avatar_path : (users[otherOf[c.id]]?.avatar_path ?? null)

  stateRef.current = { view, selectedId, titleOf }

  const go = (v: View) => { setView(v); setShowContent(true); setMenuOpen(false) }
  const open = (id: string) => { setShowNew(false); setSelectedId(id); setView('chats'); setShowContent(true); void loadConvos() }

  const shown = (convos ?? []).filter((c) => titleOf(c).toLowerCase().includes(query.toLowerCase()))
  const selected = convos?.find((c) => c.id === selectedId) ?? null
  const totalUnread = (convos ?? []).reduce((n, c) => n + (c.muted ? 0 : c.unread_count), 0)

  useEffect(() => { document.title = totalUnread > 0 ? `(${totalUnread}) Common Room` : 'Common Room' }, [totalUnread])

  const navItems: { id: View; label: string; icon: typeof MessageCircle; badge?: number; show: boolean }[] = [
    { id: 'chats', label: 'Chats', icon: MessageCircle, badge: totalUnread, show: true },
    { id: 'projects', label: 'Projects', icon: FolderKanban, show: true },
    { id: 'library', label: 'Files', icon: FolderOpen, show: true },
    { id: 'ai', label: 'AI Assistant', icon: Sparkles, show: true },
    { id: 'settings', label: 'Settings', icon: Settings, show: true },
    { id: 'inbox', label: 'Admin Bot', icon: ShieldCheck, badge: pendingCount, show: isAdmin },
  ]
  const Nav = ({ onPick }: { onPick: (v: View) => void }) => (
    <nav className="space-y-1" aria-label="Main">
      {navItems.filter((n) => n.show).map(({ id, label, icon: Icon, badge }) => (
        <button key={id} onClick={() => onPick(id)} aria-current={view === id}
          className={`flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium transition ${view === id ? 'bg-accent/15 text-fg' : 'text-mute hover:bg-white/5 hover:text-fg'}`}>
          <Icon size={18} className={view === id ? 'text-accent' : ''} />{label}
          {!!badge && badge > 0 && <span className="ml-auto rounded-full bg-accent px-2 py-0.5 text-xs font-semibold text-ink">{badge}</span>}
        </button>
      ))}
    </nav>
  )
  const Me = () => (
    <div className="flex items-center gap-3">
      {profile && <Avatar path={profile.avatar_path} name={profile.display_name} size={38} />}
      <div className="min-w-0 flex-1 text-sm">
        <p className="truncate font-medium">{profile?.display_name}</p>
        <p className="truncate text-xs text-mute">@{profile?.username}</p>
      </div>
      <button onClick={signOut} aria-label="Sign out" className="rounded-xl p-2 text-mute transition hover:bg-white/5 hover:text-fg"><LogOut size={18} /></button>
    </div>
  )

  return (
    <div className="flex h-full">
      {/* Conversation list. On phones this is the home screen. */}
      <aside className={`${showContent ? 'hidden' : 'flex'} glass w-full flex-col border-r border-white/5 md:flex md:w-[22rem] md:shrink-0`}>
        <div className="flex items-center gap-2 px-3 pb-2 pt-[max(0.75rem,env(safe-area-inset-top))] md:px-4 md:pt-4">
          <button onClick={() => setMenuOpen(true)} aria-label="Open menu" className="rounded-xl p-2 text-fg transition hover:bg-white/5 md:hidden"><Menu size={22} /></button>
          <Logo size={30} />
          <h1 className="flex-1 font-display text-lg font-bold tracking-tight">Common Room</h1>
          <button onClick={() => setShowNew(true)} className="btn-primary !rounded-xl !px-3 !py-2" aria-label="New chat"><Plus size={18} /><span className="hidden md:inline">New chat</span></button>
        </div>

        <div className="px-3 md:px-4">
          <label className="relative block">
            <Search size={16} className="pointer-events-none absolute left-3.5 top-3.5 text-mute" />
            <input className="field pl-10" placeholder="Search chats" aria-label="Search chats" value={query} onChange={(e) => setQuery(e.target.value)} />
          </label>
        </div>

        <div className="mt-3 hidden px-3 md:block md:px-4"><Nav onPick={go} /></div>

        <div className="mt-3 min-h-0 flex-1 overflow-y-auto px-2 pb-2" aria-label="Chats">
          {convos === null && [0, 1, 2].map((i) => <div key={i} className="m-2 h-16 animate-pulse rounded-2xl bg-white/5" />)}
          {convos && shown.length === 0 && (
            <div className="px-4 py-10 text-center text-sm text-mute">
              <p>{query ? 'No chats match your search.' : 'No chats yet.'}</p>
              {!query && <button className="btn-primary mt-4" onClick={() => setShowNew(true)}><Plus size={16} />Start a new chat</button>}
            </div>
          )}
          {shown.map((c) => {
            const active = selectedId === c.id && view === 'chats'
            return (
              <button key={c.id} onClick={() => { setSelectedId(c.id); setView('chats'); setShowContent(true) }}
                className={`relative flex w-full items-center gap-3 rounded-2xl px-3 py-3 text-left transition ${active ? 'bg-white/[0.08]' : 'hover:bg-white/[0.05]'}`}>
                {active && <span className="absolute left-0 top-3 h-[calc(100%-1.5rem)] w-1 rounded-full bg-accent" />}
                <Avatar path={avatarOf(c)} name={titleOf(c)} size={46} />
                <span className="min-w-0 flex-1">
                  <span className="flex items-baseline justify-between gap-2">
                    <span className={`truncate text-sm ${c.unread_count > 0 ? 'font-semibold' : 'font-medium'}`}>{titleOf(c)}</span>
                    <span className="shrink-0 text-[11px] text-mute">{shortTime(c.last_message_at)}</span>
                  </span>
                  <span className="mt-0.5 flex items-center justify-between gap-2">
                    <span className={`truncate text-xs ${c.unread_count > 0 ? 'text-fg/90' : 'text-mute'}`}>{c.last_message_preview ?? 'No messages yet'}</span>
                    {c.unread_count > 0 && <span className="shrink-0 rounded-full bg-accent px-2 py-0.5 text-[11px] font-semibold text-ink">{c.unread_count}</span>}
                  </span>
                </span>
              </button>
            )
          })}
        </div>

        <div className="hidden border-t border-white/5 p-3 md:block"><Me /></div>
      </aside>

      {/* Main area */}
      <main className={`${showContent ? 'flex' : 'hidden'} min-w-0 flex-1 flex-col md:flex`}>
        {view === 'inbox' && isAdmin ? (
          <div className="min-h-0 flex-1 overflow-y-auto">
            <button className="m-3 flex items-center gap-2 rounded-xl p-2 text-sm text-mute hover:bg-white/5 md:hidden" onClick={() => setShowContent(false)}><ArrowLeft size={16} />Back</button>
            <AdminInbox />
          </div>
        ) : view === 'ai' || view === 'projects' || view === 'library' || view === 'settings' ? (
          <>
            <button className="m-3 flex items-center gap-2 rounded-xl p-2 text-sm text-mute hover:bg-white/5 md:hidden" onClick={() => setShowContent(false)}><ArrowLeft size={16} />Back</button>
            <div className="min-h-0 flex-1">
              {view === 'ai' && <AssistantView />}
              {view === 'projects' && <ProjectsView onOpenChat={open} />}
              {view === 'library' && <LibraryView titleOf={(id) => { const c = convos?.find((x) => x.id === id); return c ? titleOf(c) : 'a chat' }} />}
              {view === 'settings' && <SettingsView />}
            </div>
          </>
        ) : selected ? (
          <ChatView key={selected.id} convo={selected} title={titleOf(selected)} avatarPath={avatarOf(selected)}
            otherUserId={selected.type === 'direct' ? (otherOf[selected.id] ?? null) : null}
            onBack={() => setShowContent(false)} onRead={loadConvos} />
        ) : (
          <div className="m-auto max-w-sm p-8 text-center">
            <button className="mb-6 flex items-center gap-2 text-sm text-mute md:hidden" onClick={() => setShowContent(false)}><ArrowLeft size={16} />Back</button>
            <div className="logo-glow mx-auto mb-5 w-fit rounded-[14px]"><Logo size={56} /></div>
            <h2 className="font-display text-2xl font-bold">Pick a chat</h2>
            <p className="mt-2 text-sm text-mute">Choose a conversation from the list, or start a new one.</p>
            <button className="btn-primary mt-5" onClick={() => setShowNew(true)}><Plus size={16} />New chat</button>
          </div>
        )}
      </main>

      {/* Mobile menu drawer */}
      {menuOpen && (
        <div className="fixed inset-0 z-40 md:hidden" role="dialog" aria-modal="true" aria-label="Menu">
          <button aria-label="Close menu" className="absolute inset-0 animate-fade-in bg-black/60 backdrop-blur-sm" onClick={() => setMenuOpen(false)} />
          <div className="glass absolute inset-y-0 left-0 flex w-72 max-w-[85%] animate-slide-in flex-col border-r border-white/10 bg-surface p-4 pt-[max(1rem,env(safe-area-inset-top))] pb-[max(1rem,env(safe-area-inset-bottom))]">
            <div className="mb-5 flex items-center gap-2.5">
              <Logo size={32} /><span className="flex-1 font-display text-lg font-bold">Common Room</span>
              <button onClick={() => setMenuOpen(false)} aria-label="Close menu" className="rounded-xl p-2 text-mute hover:bg-white/5"><X size={20} /></button>
            </div>
            <Nav onPick={go} />
            <button className="btn-primary mt-4" onClick={() => { setMenuOpen(false); setShowNew(true) }}><Plus size={16} />New chat</button>
            <div className="mt-auto border-t border-white/10 pt-4"><Me /></div>
          </div>
        </div>
      )}

      <div className="pointer-events-none fixed right-3 top-3 z-[70] flex w-[min(22rem,calc(100vw-1.5rem))] flex-col gap-2 pt-[env(safe-area-inset-top)]" aria-live="polite">
        {toasts.map((t) => (
          <button key={t.id} onClick={() => { setSelectedId(t.convId); setView('chats'); setShowContent(true); setToasts((x) => x.filter((y) => y.id !== t.id)) }}
            className="glass pointer-events-auto animate-pop rounded-2xl border border-white/10 bg-surface p-3 text-left shadow-2xl">
            <span className="block truncate text-sm font-semibold">{t.title}</span>
            <span className="block truncate text-xs text-mute">{t.body}</span>
          </button>
        ))}
      </div>
      {showNew && <NewChatDialog onClose={() => setShowNew(false)} onOpen={open} />}
    </div>
  )
}

function Gate() {
  const { session, profile, loading } = useAuth()
  if (loading) return <div className="flex h-full items-center justify-center"><div className="h-10 w-10 animate-pulse rounded-full bg-raised" /></div>
  if (!session) return <AuthScreen />
  if (!profile) return <div className="flex h-full items-center justify-center text-sm text-mute">Setting up your profile…</div>
  if (profile.approval_status !== 'approved') return <PendingScreen />
  return <DirectoryProvider><Shell /></DirectoryProvider>
}

function App() {
  if (configError) {
    return <main className="flex h-full items-center justify-center p-6"><p role="alert" className="panel max-w-md p-6 text-sm">{configError}</p></main>
  }
  return <AuthProvider><Gate /></AuthProvider>
}

createRoot(document.getElementById('root')!).render(<App />)

</script>
<script>
(function () {
  function fail(e) {
    var r = document.getElementById('root');
    if (!r) return;
    var msg = (e && (e.stack || e.message)) || String(e);
    r.innerHTML = '<div id="boot-error"><strong>Common Room could not start.</strong>\n\n' +
      msg.replace(/&/g, '&amp;').replace(/</g, '&lt;') +
      '\n\nCheck your internet connection (this page loads libraries from CDNs) and reload.</div>';
  }
  window.addEventListener('unhandledrejection', function (ev) { if (document.getElementById('boot')) fail(ev.reason); });
  setTimeout(function () { if (document.getElementById('boot')) fail(new Error('Still loading after 20 seconds. A script from a CDN may be blocked on this network.')); }, 20000);
  (async function () {
    try {
      if (!window.Babel) throw new Error('The Babel compiler did not load.');
      var src = document.getElementById('app-src').textContent;
      var out = Babel.transform(src, { filename: 'app.tsx', presets: [['typescript', { isTSX: true, allExtensions: true }], 'react'] }).code;
      var url = URL.createObjectURL(new Blob([out], { type: 'text/javascript' }));
      await import(url);
    } catch (e) { fail(e); }
  })();
})();
</script>
