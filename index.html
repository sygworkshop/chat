/** Shrinks a photo in the browser before upload so shared images stay tiny (usually 100-400 KB). */
async function compressImage(file: File, maxDim: number, quality = 0.8): Promise<File> {
  const bmp = await createImageBitmap(file)
  const scale = Math.min(1, maxDim / Math.max(bmp.width, bmp.height))
  const w = Math.max(1, Math.round(bmp.width * scale))
  const h = Math.max(1, Math.round(bmp.height * scale))
  const canvas = document.createElement('canvas')
  canvas.width = w
  canvas.height = h
  const ctx = canvas.getContext('2d')
  if (!ctx) throw new Error('Canvas unavailable')
  ctx.fillStyle = '#ffffff'
  ctx.fillRect(0, 0, w, h)
  ctx.drawImage(bmp, 0, 0, w, h)
  bmp.close()
  const blob = await new Promise<Blob | null>((resolve) => canvas.toBlob(resolve, 'image/jpeg', quality))
  if (!blob) throw new Error('Could not encode image')
  return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' })
}

const QUOTA_BYTES = 100 * 1024 * 1024
const MAX_FILE_BYTES = 3 * 1024 * 1024

const urlCache = new Map<string, { url: string; at: number }>()

/** Signed links are reused for 50 minutes so the browser can cache the file instead of downloading it again. */
async function signedUrl(path: string): Promise<string | null> {
  const hit = urlCache.get(path)
  if (hit && Date.now() - hit.at < 50 * 60_000) return hit.url
  const { data } = await supabase.storage.from('attachments').createSignedUrl(path, 3600)
  if (data?.signedUrl) { urlCache.set(path, { url: data.signedUrl, at: Date.now() }); return data.signedUrl }
  return null
}

async function openDownload(path: string, name: string) {
  const { data } = await supabase.storage.from('attachments').createSignedUrl(path, 300, { download: name })
  if (data?.signedUrl) window.open(data.signedUrl, '_blank', 'noopener')
}

function fmtSize(n: number): string {
  if (n < 1024 * 1024) return `${Math.max(1, Math.round(n / 1024))} KB`
  return `${(n / (1024 * 1024)).toFixed(1)} MB`
}

interface NotifyPrefs { browser: boolean; sound: boolean; preview: boolean }

function readPrefs(raw: unknown): NotifyPrefs {
  const r = (raw && typeof raw === 'object' ? raw : {}) as Partial<NotifyPrefs>
  return { browser: r.browser === true, sound: r.sound !== false, preview: r.preview !== false }
}
const notifySupported = () => typeof Notification !== 'undefined'
async function askPermission(): Promise<NotificationPermission> {
  if (!notifySupported()) return 'denied'
  return Notification.requestPermission()
}

let ctx: AudioContext | null = null
function beep() {
  try {
    const Ctor = window.AudioContext || (window as unknown as { webkitAudioContext: typeof AudioContext }).webkitAudioContext
    ctx = ctx ?? new Ctor()
    const o = ctx.createOscillator(), g = ctx.createGain()
    o.type = 'sine'; o.frequency.value = 880
    g.gain.setValueAtTime(0.0001, ctx.currentTime)
    g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.01)
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.25)
    o.connect(g); g.connect(ctx.destination)
    o.start(); o.stop(ctx.currentTime + 0.26)
  } catch { /* audio not available */ }
}

function showNotification(title: string, body: string, onClick?: () => void) {
  if (!notifySupported() || Notification.permission !== 'granted') return
  try {
    const n = new Notification(title, { body, tag: 'common-room' })
    n.onclick = () => { window.focus(); onClick?.(); n.close() }
  } catch { /* some mobile browsers only allow service-worker notifications */ }
}

interface AssistantEvent {
  conversation_id?: string | null
  delta?: string
  done?: boolean
  error?: string
}

/** Calls the assistant-chat Edge Function and reads its event stream. Rejects with a user-safe message. */
async function callAssistant(body: Record<string, unknown>, onEvent: (e: AssistantEvent) => void): Promise<void> {
  const { data } = await supabase.auth.getSession()
  const token = data.session?.access_token
  if (!token) throw new Error('You are signed out. Sign in again.')
  let res: Response
  try {
    res = await fetch(`${supabaseUrl}/functions/v1/assistant-chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, apikey: supabaseKey },
      body: JSON.stringify(body),
    })
  } catch {
    throw new Error('Could not reach the assistant. Check your connection.')
  }
  if (!res.ok || !res.body) {
    let msg = 'The assistant is unavailable right now.'
    try { const j = await res.json(); if (typeof j.error === 'string') msg = j.error } catch { /* keep default */ }
    throw new Error(msg)
  }
  const reader = res.body.getReader()
  const dec = new TextDecoder()
  let buf = ''
  for (;;) {
    const { done, value } = await reader.read()
    if (done) break
    buf += dec.decode(value, { stream: true })
    const parts = buf.split('\n\n')
    buf = parts.pop() ?? ''
    for (const part of parts) {
      const line = part.trim()
      if (!line.startsWith('data:')) continue
      try { onEvent(JSON.parse(line.slice(5).trim()) as AssistantEvent) } catch { /* ignore partial frame */ }
    }
  }
}

interface AuthState {
  session: Session | null
  profile: Profile | null
  isAdmin: boolean
  loading: boolean
  refresh: () => Promise<void>
  signOut: () => Promise<void>
}
const Ctx = createContext<AuthState | null>(null)

function AuthProvider({ children }: { children: ReactNode }) {
  const [session, setSession] = useState<Session | null>(null)
  const [profile, setProfile] = useState<Profile | null>(null)
  const [isAdmin, setIsAdmin] = useState(false)
  const [loading, setLoading] = useState(true)

  const load = useCallback(async (s: Session | null) => {
    if (!s) { setProfile(null); setIsAdmin(false); return }
    const { data } = await supabase.from('profiles').select('*').eq('id', s.user.id).maybeSingle()
    setProfile((data as Profile | null) ?? null)
    const { data: adm } = await supabase.rpc('is_admin')
    setIsAdmin(adm === true)
  }, [])

  useEffect(() => {
    supabase.auth.getSession().then(async ({ data }) => {
      setSession(data.session)
      await load(data.session)
      setLoading(false)
    })
    const { data: sub } = supabase.auth.onAuthStateChange((_event, s) => {
      setSession(s)
      // Defer: calling Supabase inside this callback can deadlock the auth lock.
      setTimeout(() => { void load(s) }, 0)
    })
    return () => sub.subscription.unsubscribe()
  }, [load])

  const refresh = useCallback(async () => { await load(session) }, [load, session])
  const signOut = useCallback(async () => { await supabase.auth.signOut() }, [])

  return <Ctx.Provider value={{ session, profile, isAdmin, loading, refresh, signOut }}>{children}</Ctx.Provider>
}

function useAuth() {
  const v = useContext(Ctx)
  if (!v) throw new Error('useAuth must be used inside AuthProvider')
  return v
}

// ---- src/components/Markdown.tsx ----

const esc = (s: string) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

function CodeBlock({ code, lang }: { code: string; lang: string }) {
  const [copied, setCopied] = useState(false)
  const html = useMemo(() => {
    try {
      return lang && hljs.getLanguage(lang)
        ? hljs.highlight(code, { language: lang, ignoreIllegals: true }).value
        : hljs.highlightAuto(code).value
    } catch { return esc(code) }
  }, [code, lang])
  async function copy() {
    try { await navigator.clipboard.writeText(code); setCopied(true); setTimeout(() => setCopied(false), 1500) } catch { /* clipboard blocked */ }
  }
  return (
    <div className="my-2 overflow-hidden rounded-lg border border-line bg-[#0d1117]">
      <div className="flex items-center justify-between border-b border-line px-3 py-1.5 text-xs text-mute">
        <span>{lang || 'code'}</span>
        <button onClick={copy} className="rounded px-2 py-0.5 hover:bg-raised hover:text-fg">{copied ? 'Copied' : 'Copy code'}</button>
      </div>
      <pre className="overflow-x-auto p-3 text-[13px] leading-relaxed"><code className="hljs !bg-transparent !p-0" dangerouslySetInnerHTML={{ __html: html }} /></pre>
    </div>
  )
}

function inline(text: string): ReactNode[] {
  return text.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/g).map((t, i) => {
    if (t.startsWith('`') && t.endsWith('`') && t.length > 2) return <code key={i} className="rounded bg-raised px-1 py-0.5 text-[0.9em]">{t.slice(1, -1)}</code>
    if (t.startsWith('**') && t.endsWith('**') && t.length > 4) return <strong key={i}>{t.slice(2, -2)}</strong>
    return t
  })
}

function blocks(text: string): ReactNode[] {
  return text.split(/\n{2,}/).filter((b) => b.trim()).map((b, i) => {
    const lines = b.split('\n')
    if (lines.every((l) => /^\s*[-*] /.test(l))) return <ul key={i} className="my-2 list-disc space-y-1 pl-5">{lines.map((l, j) => <li key={j}>{inline(l.replace(/^\s*[-*] /, ''))}</li>)}</ul>
    if (lines.every((l) => /^\s*\d+\. /.test(l))) return <ol key={i} className="my-2 list-decimal space-y-1 pl-5">{lines.map((l, j) => <li key={j}>{inline(l.replace(/^\s*\d+\. /, ''))}</li>)}</ol>
    const h = /^(#{1,3}) (.*)$/.exec(lines[0])
    if (h && lines.length === 1) return <p key={i} className="my-2 font-display text-base font-bold">{inline(h[2])}</p>
    return <p key={i} className="my-2 whitespace-pre-wrap break-words">{inline(b)}</p>
  })
}

function Markdown({ text }: { text: string }) {
  const parts: ReactNode[] = []
  const re = /```([\w+-]*)\n([\s\S]*?)(?:```|$)/g
  let last = 0
  let m: RegExpExecArray | null
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) parts.push(...blocks(text.slice(last, m.index)))
    parts.push(<CodeBlock key={`c${m.index}`} code={m[2].replace(/\n$/, '')} lang={m[1].toLowerCase()} />)
    last = m.index + m[0].length
    if (m[0].length === 0) re.lastIndex++
  }
  if (last < text.length) parts.push(...blocks(text.slice(last)))
  return <div className="text-sm leading-relaxed">{parts}</div>
}

  const [url, setUrl] = useState<string | null>(null)
  const media = att.mime_type.startsWith('image/') || att.mime_type.startsWith('video/')
  useEffect(() => {
    if (!media) return
    let live = true
    signedUrl(att.storage_path).then((u) => { if (live) setUrl(u) })

        const res = await fetch(url)
        if (!res.ok) throw new Error('GIPHY request failed')
        const json = await res.json() as { data: { id: string; images: Record<string, { url: string }> }[] }
        setGifs(json.data.map((g) => ({
          id: g.id,
          preview: g.images.fixed_height_small?.url ?? g.images.fixed_height.url,
          // Query strings are removed: only plain media URLs are accepted by the database.
          send: (g.images.fixed_height?.url ?? g.images.original.url).split('?')[0],
        })))
      } catch { setError('Could not load GIFs. Check your GIPHY key and connection.') }
      setLoading(false)
    }, 300)
    return () => clearTimeout(t)
  }, [q])

  return (
    <div className="glass absolute bottom-full left-0 right-0 z-20 mb-2 animate-pop rounded-2xl border border-white/10 bg-surface p-3 shadow-2xl">
      <div className="mb-2 flex items-center gap-2">
        <input className="field" autoFocus placeholder="Search GIFs" aria-label="Search GIFs" value={q} onChange={(e) => setQ(e.target.value)} disabled={!GIPHY_KEY} />
        <button onClick={onClose} aria-label="Close GIF picker" className="rounded-xl p-2 hover:bg-white/5"><X size={18} /></button>
      </div>
      {!GIPHY_KEY ? (
        <p className="p-3 text-sm text-mute">GIFs need a free GIPHY API key. The site owner adds it once in the setup (see README), then search works here.</p>
      ) : (
        <>
          {error && <p role="alert" className="p-2 text-sm text-bad">{error}</p>}
          {loading && gifs.length === 0 && <p className="p-2 text-sm text-mute">Loading…</p>}
          <div className="grid max-h-60 grid-cols-3 gap-1.5 overflow-y-auto">
            {gifs.map((g) => (
              <button key={g.id} onClick={() => onPick(g.send)} className="overflow-hidden rounded-lg bg-white/5 transition hover:ring-2 hover:ring-accent">
                <img src={g.preview} alt="GIF" loading="lazy" referrerPolicy="no-referrer" className="h-24 w-full object-cover" />
              </button>
            ))}
          </div>
          <p className="mt-2 text-right text-[10px] text-mute">Powered by GIPHY</p>
        </>
      )}
    </div>
  )
}

function NewChatDialog({ onClose, onOpen }: { onClose: () => void; onOpen: (conversationId: string, type: 'direct' | 'group') => void }) {
  const { session } = useAuth()
  const { list, users } = useDirectory()
  const [q, setQ] = useState('')
  const [picked, setPicked] = useState<string[]>([])
  const [title, setTitle] = useState('')
  const [busy, setBusy] = useState(false)
  const [error, setError] = useState<string | null>(null)

  const people = list.filter((u) => u.id !== session?.user.id && `${u.display_name} ${u.username}`.toLowerCase().includes(q.toLowerCase()))
  const isGroup = picked.length > 1
  const toggle = (id: string) => setPicked((p) => (p.includes(id) ? p.filter((x) => x !== id) : [...p, id]))

  async function start() {
    if (picked.length === 0) return
    setError(null)
    if (isGroup && !title.trim()) return setError('Give the group a name.')
    setBusy(true)
    if (!isGroup) {
      const { data, error } = await supabase.rpc('get_or_create_direct', { p_other: picked[0] })
      setBusy(false)
      if (error || !data) return setError('Could not start that chat. They may be unavailable.')
      onOpen(data as string, 'direct')
    } else {
      const { data, error } = await supabase.rpc('create_group', { p_title: title.trim(), p_description: null, p_members: picked })
      setBusy(false)
      if (error || !data) return setError('Could not create the group.')
      onOpen(data as string, 'group')
    }
  }

  return (
    <div className="fixed inset-0 z-50 flex animate-fade-in items-end justify-center bg-black/60 p-0 backdrop-blur-sm sm:items-center sm:p-4" role="dialog" aria-modal="true" aria-label="New chat">
      <div className="panel flex max-h-[88dvh] w-full max-w-md animate-pop flex-col rounded-b-none p-5 sm:rounded-b-3xl">
        <div className="flex items-center justify-between">
          <h2 className="font-display text-xl font-bold">New chat</h2>
          <button onClick={onClose} aria-label="Close" className="rounded-xl p-2 text-mute hover:bg-white/5"><X size={18} /></button>
        </div>
        <p className="mt-1 text-sm text-mute">Pick one person to chat privately, or pick several to start a group.</p>

        {picked.length > 0 && (
          <div className="mt-3 flex flex-wrap gap-1.5">
            {picked.map((id) => (
              <button key={id} onClick={() => toggle(id)} className="flex items-center gap-1.5 rounded-full bg-accent/15 py-1 pl-1 pr-2.5 text-xs text-fg hover:bg-accent/25" aria-label={`Remove ${users[id]?.display_name ?? 'person'}`}>
                <Avatar path={users[id]?.avatar_path} name={users[id]?.display_name ?? '?'} size={20} />{users[id]?.display_name}<X size={12} />
              </button>
            ))}
          </div>
        )}

        <input className="field mt-3" placeholder="Search people" aria-label="Search people" value={q} onChange={(e) => setQ(e.target.value)} />
        <ul className="mt-2 min-h-[8rem] flex-1 overflow-y-auto">
          {people.length === 0 && <li className="p-3 text-sm text-mute">No one else is here yet. Approve a request from the Admin Bot first.</li>}
          {people.map((u) => {
            const on = picked.includes(u.id)
            return (
              <li key={u.id}>
                <button onClick={() => toggle(u.id)} aria-pressed={on} className="flex w-full items-center gap-3 rounded-xl px-2 py-2 text-left transition hover:bg-white/5">
                  <Avatar path={u.avatar_path} name={u.display_name} size={40} />
                  <span className="min-w-0 flex-1 text-sm"><span className="block truncate font-medium">{u.display_name}</span><span className="block truncate text-xs text-mute">@{u.username}</span></span>
                  <span className={`flex h-5 w-5 items-center justify-center rounded-full border ${on ? 'border-accent bg-accent text-white' : 'border-white/20'}`}>{on && <Check size={12} />}</span>
                </button>
              </li>
            )
          })}
        </ul>

        {isGroup && <input className="field mt-3" placeholder="Group name" aria-label="Group name" value={title} maxLength={80} onChange={(e) => setTitle(e.target.value)} />}
        {error && <p role="alert" className="mt-2 text-sm text-bad">{error}</p>}
        <button className="btn-primary mt-3 w-full" onClick={start} disabled={busy || picked.length === 0}>
          {busy ? 'Working…' : picked.length === 0 ? 'Select someone' : isGroup ? `Create group (${picked.length + 1} people)` : 'Start chat'}
        </button>
      </div>
    </div>
  )
}

// ---- src/features/calls/CallOverlay.tsx ----

const MAX_PEOPLE = 4

function RemoteVideo({ stream, muted }: { stream: MediaStream | null; muted?: boolean }) {
  return (
    <video autoPlay playsInline muted={muted} className="h-full w-full object-cover"
      ref={(el) => { if (el && el.srcObject !== stream) el.srcObject = stream }} />
  )
}

/** Small peer-to-peer call (mesh, up to 4 people). Signalling travels over a private Realtime channel. */
function CallOverlay({ conversationId, title, onClose }: { conversationId: string; title: string; onClose: () => void }) {
  const { session } = useAuth()
  const me = session!.user.id
  const { users } = useDirectory()
  const [peers, setPeers] = useState<Record<string, MediaStream>>({})
  const [micOn, setMicOn] = useState(true)
  const [camOn, setCamOn] = useState(true)
  const [sharing, setSharing] = useState(false)
  const [notice, setNotice] = useState<string | null>(null)
  const [devices, setDevices] = useState<MediaDeviceInfo[]>([])
  const [showDevices, setShowDevices] = useState(false)
  const [localStream, setLocalStream] = useState<MediaStream | null>(null)

  const localRef = useRef<MediaStream | null>(null)
  const screenRef = useRef<MediaStream | null>(null)
  const chRef = useRef<RealtimeChannel | null>(null)
  const pcs = useRef(new Map<string, RTCPeerConnection>())
  const remote = useRef(new Map<string, MediaStream>())
  const pendingIce = useRef(new Map<string, RTCIceCandidateInit[]>())
  const offered = useRef(new Set<string>())
  const canShare = typeof navigator !== 'undefined' && !!navigator.mediaDevices && 'getDisplayMedia' in navigator.mediaDevices

  const send = (event: string, payload: Record<string, unknown>) => {
    void chRef.current?.send({ type: 'broadcast', event, payload: { from: me, ...payload } })
  }

  const dropPeer = (id: string) => {
    pcs.current.get(id)?.close()
    pcs.current.delete(id); remote.current.delete(id); pendingIce.current.delete(id); offered.current.delete(id)
    setPeers((p) => { const n = { ...p }; delete n[id]; return n })
  }

  const makePc = (peerId: string): RTCPeerConnection => {
    const existing = pcs.current.get(peerId)
    if (existing) return existing
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS })
    pcs.current.set(peerId, pc)
    const local = localRef.current
    const audio = local?.getAudioTracks()[0]
    const video = local?.getVideoTracks()[0]
    if (audio && local) pc.addTrack(audio, local); else pc.addTransceiver('audio', { direction: 'recvonly' })
    if (video && local) pc.addTrack(video, local); else pc.addTransceiver('video', { direction: 'sendrecv' })
    pc.onicecandidate = (e) => { if (e.candidate) send('ice', { to: peerId, candidate: e.candidate.toJSON() }) }
    pc.ontrack = (e) => {
      let ms = remote.current.get(peerId)
      if (!ms) { ms = new MediaStream(); remote.current.set(peerId, ms) }
      if (!ms.getTracks().includes(e.track)) ms.addTrack(e.track)
      const stream = ms
      setPeers((p) => ({ ...p, [peerId]: stream }))
    }
    pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed' || pc.connectionState === 'closed') dropPeer(peerId) }
    return pc
  }

  const flushIce = async (id: string, pc: RTCPeerConnection) => {
    for (const c of pendingIce.current.get(id) ?? []) await pc.addIceCandidate(c).catch(() => {})
    pendingIce.current.delete(id)
  }

  // The person with the smaller id always sends the offer, which avoids both sides offering at once.
  const meet = async (peer: string) => {
    if (peer === me || offered.current.has(peer) || me > peer) return
    if (pcs.current.size >= MAX_PEOPLE - 1 && !pcs.current.has(peer)) return
    offered.current.add(peer)
    const pc = makePc(peer)
    const offer = await pc.createOffer()
    await pc.setLocalDescription(offer)
    send('offer', { to: peer, sdp: pc.localDescription })
  }

  const replaceTrack = (kind: 'audio' | 'video', track: MediaStreamTrack | null) => {
    pcs.current.forEach((pc) => {
      const t = pc.getTransceivers().find((x) => x.receiver.track.kind === kind)
      void t?.sender.replaceTrack(track)
    })
  }

  useEffect(() => {
    let live = true
    let ch: RealtimeChannel | null = null
    void (async () => {
      let stream: MediaStream | null = null
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: { width: 1280, height: 720 } }) }
      catch {
        try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); setNotice('Camera unavailable. You joined with audio only.') }
        catch { setNotice('No microphone or camera access. You can watch and listen only.') }
      }
      if (!live) { stream?.getTracks().forEach((t) => t.stop()); return }
      localRef.current = stream; setLocalStream(stream)
      setMicOn(!!stream?.getAudioTracks().length); setCamOn(!!stream?.getVideoTracks().length)
      navigator.mediaDevices.enumerateDevices().then((d) => { if (live) setDevices(d) }).catch(() => {})

      ch = supabase.channel(`call:${conversationId}`, { config: { private: true } })
      const onlyMine = (p: { from?: string; to?: string }) => p.from && p.from !== me && (!p.to || p.to === me)
      ch.on('broadcast', { event: 'join' }, ({ payload }) => {
        const p = payload as { from?: string }
        if (!p.from || p.from === me) return
        send('hello', { to: p.from }); void meet(p.from)
      })
      ch.on('broadcast', { event: 'hello' }, ({ payload }) => {
        const p = payload as { from?: string; to?: string }
        if (onlyMine(p)) void meet(p.from!)
      })
      ch.on('broadcast', { event: 'offer' }, async ({ payload }) => {
        const p = payload as { from?: string; to?: string; sdp?: RTCSessionDescriptionInit }
        if (!onlyMine(p) || !p.sdp) return
        const pc = makePc(p.from!)
        await pc.setRemoteDescription(p.sdp)
        await flushIce(p.from!, pc)
        const answer = await pc.createAnswer()
        await pc.setLocalDescription(answer)
        send('answer', { to: p.from, sdp: pc.localDescription })
      })
      ch.on('broadcast', { event: 'answer' }, async ({ payload }) => {
        const p = payload as { from?: string; to?: string; sdp?: RTCSessionDescriptionInit }
        if (!onlyMine(p) || !p.sdp) return
        const pc = pcs.current.get(p.from!)
        if (!pc) return
        await pc.setRemoteDescription(p.sdp)
        await flushIce(p.from!, pc)
      })
      ch.on('broadcast', { event: 'ice' }, async ({ payload }) => {
        const p = payload as { from?: string; to?: string; candidate?: RTCIceCandidateInit }
        if (!onlyMine(p) || !p.candidate) return
        const pc = pcs.current.get(p.from!)
        if (pc && pc.remoteDescription) await pc.addIceCandidate(p.candidate).catch(() => {})
        else pendingIce.current.set(p.from!, [...(pendingIce.current.get(p.from!) ?? []), p.candidate])
      })
      ch.on('broadcast', { event: 'leave' }, ({ payload }) => { const f = (payload as { from?: string }).from; if (f) dropPeer(f) })
      ch.subscribe((status) => { if (status === 'SUBSCRIBED') { chRef.current = ch; send('join', {}) } })
    })()

    return () => {
      live = false
      send('leave', {})
      pcs.current.forEach((pc) => pc.close()); pcs.current.clear()
      localRef.current?.getTracks().forEach((t) => t.stop())
      screenRef.current?.getTracks().forEach((t) => t.stop())
      chRef.current = null
      if (ch) void supabase.removeChannel(ch)
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [conversationId])

  function toggleMic() {
    const tracks = localRef.current?.getAudioTracks() ?? []
    const next = !micOn
    tracks.forEach((t) => { t.enabled = next }); setMicOn(next && tracks.length > 0)
  }
  function toggleCam() {
    const tracks = localRef.current?.getVideoTracks() ?? []
    const next = !camOn
    tracks.forEach((t) => { t.enabled = next }); setCamOn(next && tracks.length > 0)
  }
  function stopShare() {
    screenRef.current?.getTracks().forEach((t) => t.stop()); screenRef.current = null
    replaceTrack('video', localRef.current?.getVideoTracks()[0] ?? null)
    setSharing(false)
  }
  async function toggleShare() {
    if (sharing) return stopShare()
    try {
      const ds = await navigator.mediaDevices.getDisplayMedia({ video: true })
      screenRef.current = ds
      const track = ds.getVideoTracks()[0]
      track.onended = () => stopShare()
      replaceTrack('video', track); setSharing(true)
    } catch { /* cancelled */ }
  }
  async function switchDevice(kind: 'audio' | 'video', deviceId: string) {
    try {
      const s = await navigator.mediaDevices.getUserMedia(kind === 'video' ? { video: { deviceId: { exact: deviceId } } } : { audio: { deviceId: { exact: deviceId } } })
      const track = kind === 'video' ? s.getVideoTracks()[0] : s.getAudioTracks()[0]
      const local = localRef.current ?? new MediaStream()
      const old = kind === 'video' ? local.getVideoTracks() : local.getAudioTracks()
      old.forEach((t) => { t.stop(); local.removeTrack(t) })
      local.addTrack(track)
      localRef.current = local; setLocalStream(new MediaStream(local.getTracks()))
      if (!(kind === 'video' && sharing)) replaceTrack(kind, track)
    } catch { setNotice('Could not switch to that device.') }
  }

  const cams = devices.filter((d) => d.kind === 'videoinput')
  const mics = devices.filter((d) => d.kind === 'audioinput')
  const ids = Object.keys(peers)
  const tiles = 1 + ids.length
  const cols = tiles <= 1 ? 'grid-cols-1' : tiles === 2 ? 'grid-cols-1 sm:grid-cols-2' : 'grid-cols-2'

  return (
    <div className="fixed inset-0 z-[60] flex animate-fade-in flex-col bg-ink/95 backdrop-blur-xl" role="dialog" aria-modal="true" aria-label={`Video call: ${title}`}>
      <header className="flex items-center gap-3 px-4 pb-2 pt-[max(1rem,env(safe-area-inset-top))]">
        <div className="min-w-0 flex-1"><h2 className="truncate font-display text-lg font-bold">{title}</h2><p className="text-xs text-mute">{ids.length === 0 ? 'Waiting for others to join…' : `${tiles} in call`}</p></div>
      </header>
      {notice && <p role="status" className="mx-4 rounded-xl bg-warn/15 px-3 py-2 text-sm text-warn">{notice}</p>}
      <div className={`grid min-h-0 flex-1 gap-3 p-4 ${cols}`}>
        <div className="relative overflow-hidden rounded-2xl border border-white/10 bg-surface">
          {camOn || sharing ? <RemoteVideo stream={sharing ? screenRef.current : localStream} muted /> : <div className="flex h-full items-center justify-center"><Avatar path={users[me]?.avatar_path} name={users[me]?.display_name ?? 'You'} size={72} /></div>}
          <span className="absolute bottom-2 left-2 rounded-lg bg-black/60 px-2 py-0.5 text-xs">You{sharing ? ' (sharing screen)' : ''}{!micOn ? ' · muted' : ''}</span>
        </div>
        {ids.map((id) => (
          <div key={id} className="relative overflow-hidden rounded-2xl border border-white/10 bg-surface">
            <RemoteVideo stream={peers[id]} />
            <span className="absolute bottom-2 left-2 rounded-lg bg-black/60 px-2 py-0.5 text-xs">{users[id]?.display_name ?? 'Someone'}</span>
          </div>
        ))}
      </div>
      {showDevices && (
        <div className="glass mx-auto mb-2 w-full max-w-md animate-pop rounded-2xl border border-white/10 bg-surface p-3 text-sm">
          <label className="block"><span className="mb-1 block text-mute">Camera</span>
            <select className="field" onChange={(e) => void switchDevice('video', e.target.value)} defaultValue=""><option value="" disabled>Choose camera</option>{cams.map((d, i) => <option key={d.deviceId || i} value={d.deviceId}>{d.label || `Camera ${i + 1}`}</option>)}</select></label>
          <label className="mt-2 block"><span className="mb-1 block text-mute">Microphone</span>
            <select className="field" onChange={(e) => void switchDevice('audio', e.target.value)} defaultValue=""><option value="" disabled>Choose microphone</option>{mics.map((d, i) => <option key={d.deviceId || i} value={d.deviceId}>{d.label || `Microphone ${i + 1}`}</option>)}</select></label>
        </div>
      )}
      <footer className="flex items-center justify-center gap-3 px-4 pb-[max(1.25rem,env(safe-area-inset-bottom))] pt-2">
        <button onClick={toggleMic} aria-pressed={!micOn} aria-label={micOn ? 'Mute microphone' : 'Unmute microphone'} className={`rounded-full p-3.5 transition ${micOn ? 'bg-white/10 hover:bg-white/15' : 'bg-bad text-white'}`}>{micOn ? <Mic size={20} /> : <MicOff size={20} />}</button>
        <button onClick={toggleCam} aria-pressed={!camOn} aria-label={camOn ? 'Turn camera off' : 'Turn camera on'} className={`rounded-full p-3.5 transition ${camOn ? 'bg-white/10 hover:bg-white/15' : 'bg-bad text-white'}`}>{camOn ? <Video size={20} /> : <VideoOff size={20} />}</button>
        {canShare && <button onClick={toggleShare} aria-pressed={sharing} aria-label={sharing ? 'Stop sharing screen' : 'Share screen'} className={`rounded-full p-3.5 transition ${sharing ? 'bg-accent text-ink' : 'bg-white/10 hover:bg-white/15'}`}>{sharing ? <MonitorOff size={20} /> : <Monitor size={20} />}</button>}
        <button onClick={() => setShowDevices((v) => !v)} aria-pressed={showDevices} aria-label="Choose camera and microphone" className="rounded-full bg-white/10 p-3.5 transition hover:bg-white/15"><Settings2 size={20} /></button>
        <button onClick={onClose} aria-label="Leave call" className="rounded-full bg-bad p-3.5 text-white transition hover:brightness-110"><PhoneOff size={20} /></button>
      </footer>
    </div>
  )
}

const PAGE = 40
const EMOJIS = ['👍', '❤️', '😂', '🎉', '😮', '🙏']

interface Props {
  convo: ConversationSummary
  title: string
  avatarPath: string | null
  otherUserId: string | null
  onBack: () => void
  onRead: () => void
}
interface Member { user_id: string; role: string; last_read_at: string | null }
interface Kept { id: string; content: string; sender_id: string; message_type: string }

function timeLeft(expires: string): string {
  const ms = Date.parse(expires) - Date.now()
  if (ms <= 0) return 'now'
  const h = Math.floor(ms / 3_600_000)
  if (h >= 48) return `${Math.floor(h / 24)}d`
  if (h >= 1) return `${h}h`
  return `${Math.max(1, Math.ceil(ms / 60_000))}m`
}

function ChatView({ convo, title, avatarPath, otherUserId, onBack, onRead }: Props) {
  const { session } = useAuth()
  const me = session!.user.id
  const { users, list, reload: reloadDir } = useDirectory()
